<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bold Performance</title>
<meta name="description" content="Performance dos barbeiros: metas do mês, faturamento, extras, assinaturas e produtos, nota por período e dicas para melhorar.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bold">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout: menu lateral fixo no computador (≥ 960px), barra inferior no celular */
:root{
  --bg:#070707;--surface:#151515;--surface-2:#1e1e1e;--ink:#f4f4f2;--muted:#8b8b8b;--line:#262626;--shadow:none;--off:#2a2a2a;
  --accent:#ff751f;--accent-ink:#ff8a3d;--accent-soft:#2a1608;--on-accent:#000000;
  --good:#a3e05f;--good-soft:#1a2610;--warn:#f5c03b;--warn-soft:#2b230c;--bad:#f2585b;--bad-soft:#2e1213;
  --side:#070707;--side-line:#1c1c1c;--side-hover:#151515;
  --display:"Outfit",system-ui,sans-serif;--body:"Outfit",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#efefed;--surface:#ffffff;--surface-2:#f3f3f1;--ink:#0a0a0a;--muted:#6b6b6b;--line:#e3e3e0;--shadow:0 1px 2px rgba(0,0,0,.05);--off:#e2e2df;
  --accent:#ff751f;--accent-ink:#c2510a;--accent-soft:#fff0e6;--on-accent:#000000;
  --good:#4c9a1c;--good-soft:#e8f4dc;--warn:#b07d06;--warn-soft:#f8eedd;--bad:#d1343a;--bad-soft:#f9e4e2;
  --side:#000000;--side-line:#1c1c1c;--side-hover:#141414;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
svg.ic{width:20px;height:20px;flex:0 0 20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- estrutura ---------- */
.app{display:block;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.shell{min-width:0}
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent}
.top-in{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:1160px;margin:0 auto}
.top h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;margin:0;line-height:1.15;letter-spacing:-.01em;text-transform:uppercase}
.top .sub{font-size:13px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
main{display:flex;flex-direction:column;gap:16px;padding:6px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));max-width:1160px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;width:min(86vw,290px);z-index:50;background:var(--side);border-right:1px solid var(--side-line);padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-105%);visibility:hidden;overflow-y:auto;color:#f5f5f5}
.app.menu-open .side{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.4)}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.app.menu-open .scrim{display:block}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .25s ease,visibility .25s}.bar>span,.mbar>span{transition:width .5s ease}}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.brand img{width:150px;height:auto;display:block}
.brand .fechar{margin-left:auto}
.side-label{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:#7a7a7a;padding:12px 10px 4px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#a3a3a3;font:600 14.5px var(--body);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left}
.nav-i:hover{background:var(--side-hover);color:#fff}
.nav-i[aria-current="page"]{background:var(--accent);color:#000}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--side-line);padding-top:12px}
.user{display:flex;align-items:center;gap:10px;padding:4px 8px 8px;min-width:0}
.user b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user span{font-size:12px;color:#8a8a8a}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;font:800 italic 14px var(--display);flex:0 0 34px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#000;border-top:1px solid #1c1c1c;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:#8a8a8a;font:600 11px var(--body);padding:6px 2px;border-radius:8px;cursor:pointer;min-width:0}
.bottom button[aria-current="page"]{color:var(--accent)}
.mlogo img{height:22px;width:auto;display:block;margin-bottom:2px}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;padding-bottom:0}
  .side{position:sticky;top:0;height:100vh;width:auto;transform:none;visibility:visible;z-index:1;box-shadow:none!important}
  .burger,.scrim,.bottom,.mlogo{display:none!important}
  main{padding:6px 32px 48px}
  .top-in{padding:24px 32px 12px}
  .top h1{font-size:26px}
}

/* ---------- componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font:800 italic 17px var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px}
.card h3{font:700 15px var(--display);margin:0 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.sm{font-size:13px}.xs{font-size:12px}.muted{color:var(--muted)}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--accent-ink)}
.num{font:800 italic 24px var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.lbl{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#000;font:800 italic 14px var(--display);text-transform:uppercase;letter-spacing:.02em;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-style:normal;font-weight:700;text-transform:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-style:normal;font-weight:600;text-transform:none}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line);font-style:normal;font-weight:600;text-transform:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--ink)}
.side .icon-btn{background:#0e0e0e;border-color:#262626;color:#f5f5f5}
.link{border:0;background:none;color:var(--accent-ink);font:600 13px var(--body);cursor:pointer;padding:0}
label.f{display:flex;flex-direction:column;gap:5px;font:600 13px var(--body);color:var(--muted);min-width:0}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.n{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bar.good>span{background:var(--good)}.bar.warn>span{background:var(--warn)}.bar.bad>span{background:var(--bad)}
.loading{color:var(--muted);text-align:center;padding:40px 16px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font:600 14px var(--body);z-index:100;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
@media (min-width:960px){.toast{bottom:24px}}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.demo-band{background:var(--accent);color:#000;font:700 12.5px var(--body);text-align:center;padding:6px 12px}
.demo-band button{border:0;background:#000;color:var(--accent);font:700 12px var(--body);border-radius:6px;padding:2px 8px;margin-left:8px;cursor:pointer}

/* período */
.pbar{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:700 13px var(--body);padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#000}
.pnav{display:flex;align-items:center;gap:10px}
.pnav b{flex:1;text-align:center;font:800 italic 15px var(--display);text-transform:uppercase}
.pnav .icon-btn{font-size:20px;line-height:1}
.pnav .icon-btn:disabled{opacity:.35;cursor:default}

/* nota */
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center}
@media (min-width:720px){.hero{grid-template-columns:260px 1fr}}
.gauge{position:relative;width:100%;max-width:260px;margin:0 auto}
.gauge svg{width:100%;height:auto;display:block}
.gauge .gv{text-align:center;margin-top:-4px}
.gauge .gv b{display:block;font:900 italic 46px var(--display);line-height:1;letter-spacing:-.02em}
.gauge .gv span{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase}
.hero-txt h2{font-size:22px}
.cmp{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.cmp .pill{font-size:12.5px}

/* KPIs */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .num{font-size:22px;word-break:break-word}
.kpi .meta{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.kpi .meta>span{white-space:nowrap}

/* dicas */
.dicas{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.dica{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.dica i{font-style:normal;flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--display);background:var(--accent);color:#000}
.dica b{display:block;font-size:14px}
.dica span{font-size:13.5px;color:var(--muted)}
.hero-dica{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px}
.hero-dica.bad{border-color:var(--bad);background:var(--bad-soft)}.hero-dica.warn{border-color:var(--warn);background:var(--warn-soft)}.hero-dica.good{border-color:var(--good);background:var(--good-soft)}

/* tabelas */
.tbl-wrap{overflow-x:auto;margin:6px -4px 0;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tr.avg td{font-weight:700;color:var(--muted);border-bottom:0}
td .nb{font:800 italic 16px var(--display)}
.chart-box{position:relative;height:240px;margin-top:8px}
.mlist{display:flex;flex-direction:column;margin-top:8px}
.mrow{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mrow:last-child{border-bottom:0}
.mgrid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:720px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#000}
.calc-out{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));margin-top:14px}
.calc-out .num{font-size:24px;white-space:nowrap}
.calc-out>div{background:var(--surface-2);border-radius:12px;padding:12px}

.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%}
.modal p{margin:0 0 14px;font-size:15px}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 70% at 50% 0%,#1d0d03 0%,#000 60%)}
.auth-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;color:#f5f5f5}
.auth-box img{width:min(300px,80%);height:auto;margin:0 auto 6px;display:block}
.auth-box input{background:#111;border-color:#2a2a2a;color:#f5f5f5}
.auth-box .muted{color:#9a9a9a}
.auth-box .btn.ghost{color:#f5f5f5;border-color:#2a2a2a}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.auth-msg{font-size:13.5px;border-radius:10px;padding:10px 12px;background:#161616}

/* ---------- visual v2: cartões arredondados, números finos, barras em segmentos ---------- */
body{font-weight:400}
.top h1{font:500 24px var(--display);text-transform:none;letter-spacing:-.01em}
@media (min-width:960px){.top h1{font-size:30px}}
.card{border-radius:26px;padding:22px;border:1px solid rgba(255,255,255,.04);background:linear-gradient(160deg,color-mix(in srgb,var(--surface) 100%,#fff 3%) 0%,var(--surface) 60%)}
:root[data-theme="light"] .card{border-color:var(--line);background:var(--surface)}
.card h2{font:400 20px var(--display);text-transform:none;letter-spacing:-.01em;margin:0 0 4px}
.kpi{border-radius:22px;padding:18px;border:1px solid rgba(255,255,255,.04);gap:8px}
:root[data-theme="light"] .kpi{border-color:var(--line)}
.num{font:300 30px var(--display);letter-spacing:-.02em}
.kpi .num{font-size:24px;white-space:nowrap}
.lbl{font:400 13.5px var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.btn{border-radius:999px;font:600 14px var(--display);text-transform:none;letter-spacing:0;padding:10px 20px}
.btn.sec,.btn.ghost,.btn.danger{font-weight:500}
.seg{border-radius:999px;padding:5px}
.seg button{border-radius:999px;font:500 13.5px var(--body)}
.pnav b{font:400 17px var(--display);text-transform:none}
.pnav .icon-btn,.icon-btn{border-radius:999px}
.pill{font:500 12.5px var(--body);padding:5px 12px}
.hero-dica{border-left:0;border-radius:16px;padding:12px 16px}
.dica{border-radius:16px}
.dica i{border-radius:999px;font:600 13px var(--display)}
.calc-out>div{border-radius:18px}
td .nb{font:400 18px var(--display)}
th{font:500 12px var(--body);letter-spacing:.02em;text-transform:none}
.nav-i{border-radius:999px;font:500 15px var(--body)}
.side-label{letter-spacing:.06em}
.gauge .gv b{font:300 54px var(--display);letter-spacing:-.03em}
.gauge .gv span{font:500 12px var(--body);letter-spacing:.08em}
input,select,textarea{border-radius:14px}
.mrow,.li{border-color:var(--line)}
/* barra em segmentos */
.sbar5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;height:9px}
.sbar5 i{border-radius:99px;background:var(--off);overflow:hidden;display:block}
.sbar5 b{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sbar5.good b{background:var(--good);box-shadow:0 0 10px color-mix(in srgb,var(--good) 40%,transparent)}
.sbar5.warn b{background:var(--warn)}.sbar5.bad b{background:var(--bad)}
/* botão de seta nos cartões */
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.arrow{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:18px}
.arrow:hover{border-color:var(--accent);color:var(--accent)}
/* lista estilo placar (linha do tempo) */
.score{position:relative;display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-left:18px}
.score::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:1px;background:var(--good);opacity:.5}
.score-i{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 0;cursor:pointer}
.score-i::before{content:"";position:absolute;left:-17px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.score-i[data-nv="good"]::before{background:var(--good)}.score-i[data-nv="warn"]::before{background:var(--warn)}.score-i[data-nv="bad"]::before{background:var(--bad)}
.score-i b{font-weight:500}
.score-i .sbar5{grid-column:1/-1}
.score-i .nb{font:300 22px var(--display)}
.score-i:hover b{color:var(--accent-ink)}
</style>
<script>(function(){try{var m=localStorage.getItem("bp-tema")||"dark";document.documentElement.dataset.theme=m}catch(e){}})()</script>
</head>
<body>
<div id="authRoot"><p class="loading">Carregando…</p></div>
<div class="app" id="app" hidden>
  <aside class="side" id="sidebar">
    <div class="brand"><img src="icons/logo.png" alt="Bold Performance" width="150" height="99"><button class="icon-btn burger fechar" data-act="menu" data-v="0" aria-label="Fechar menu">✕</button></div>
    <div class="side-label" id="sidelabel">Menu</div>
    <nav id="sidenav" aria-label="Menu principal"></nav>
    <div class="side-foot">
      <div class="user" id="sideuser"></div>
      <button class="nav-i" data-act="tema"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>Tema claro / escuro</button>
      <button class="nav-i" data-act="sair"><svg class="ic" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg>Sair</button>
    </div>
  </aside>

const TIPOS = [["dia","Diário"],["semana","Semanal"],["quinzena","Quinzenal"],["mes","Mensal"],["trimestre","Trimestral"],["semestre","Semestral"],["ano","Anual"]];
const TIPO_NOME = Object.fromEntries(TIPOS);
function periodo(tipo, ref){
  const d = pD(ref), y = d.getFullYear(), m = d.getMonth();
  let ini, fim, label;
  if (tipo === "dia") { ini = fim = ref; label = ref === today() ? "Hoje" : ref === addD(today(), -1) ? "Ontem" : pD(ref).toLocaleDateString("pt-BR", {weekday:"short", day:"2-digit", month:"short"}); }
  else if (tipo === "semana") { const dow = (d.getDay() + 6) % 7; ini = addD(ref, -dow); fim = addD(ini, 6); label = `${dataBR(ini)} a ${dataBR(fim)}`; }
  else if (tipo === "quinzena") { if (d.getDate() <= 15) { ini = iso(new Date(y, m, 1)); fim = iso(new Date(y, m, 15)); } else { ini = iso(new Date(y, m, 16)); fim = mesFim(ref); } label = `${dataBR(ini)} a ${dataBR(fim)}`; }
  else if (tipo === "mes") { ini = mesIni(ref); fim = mesFim(ref); label = mesNome(ref); }
  else if (tipo === "trimestre") { const q = Math.floor(m/3); ini = iso(new Date(y, q*3, 1)); fim = iso(new Date(y, q*3+3, 0)); label = `${q+1}º trimestre ${y}`; }
  else if (tipo === "semestre") { const s = m < 6 ? 0 : 1; ini = iso(new Date(y, s*6, 1)); fim = iso(new Date(y, s*6+6, 0)); label = `${s+1}º semestre ${y}`; }
  else { ini = `${y}-01-01`; fim = `${y}-12-31`; label = String(y); }
  return { tipo, ref, ini, fim, label };
}
function moverPeriodo(p, dir){
  const passo = { dia:[0,1], semana:[0,7], quinzena:null, mes:[1], trimestre:[3], semestre:[6], ano:[12] }[p.tipo];
  if (p.tipo === "quinzena") return dir > 0 ? addD(p.fim, 1) : addD(p.ini, -1);
  if (p.tipo === "dia" || p.tipo === "semana") return addD(p.ini, dir * passo[1]);
  return addM(p.ini, dir * passo[0]);
}

/* ======================= CÁLCULOS ======================= */
let CFG = { nome:"Barbearia", dias_trabalho:[1,2,3,4,5,6] };
const ehDiaUtil = s => CFG.dias_trabalho.includes(pD(s).getDay());
const _uteisMes = {};
function uteisNoMes(m){ m = mesIni(m); if (_uteisMes[m + CFG.dias_trabalho]) return _uteisMes[m + CFG.dias_trabalho]; let n = 0; for (let d = m, f = mesFim(m); d <= f; d = addD(d, 1)) if (ehDiaUtil(d)) n++; return _uteisMes[m + CFG.dias_trabalho] = n || 1; }
function uteisEntre(a, b){ let n = 0; for (let d = a; d <= b; d = addD(d, 1)) if (ehDiaUtil(d)) n++; return n; }

function totais(lista){
  const t = { atendimentos:0, servicos:0, extras:0, qtd_extras:0, assinaturas:0, produtos:0, dias:0 };
  for (const l of lista) { t.atendimentos += +l.atendimentos||0; t.servicos += +l.servicos||0; t.extras += +l.extras||0; t.qtd_extras += +l.qtd_extras||0; t.assinaturas += +l.assinaturas||0; t.produtos += +l.produtos||0; t.dias++; }
  return comDerivados(t);
}
function comDerivados(t){
  t.faturamento = t.servicos + t.extras + t.produtos;
  t.ticket = t.atendimentos ? t.faturamento / t.atendimentos : 0;
  t.extraPorAtend = t.atendimentos ? t.qtd_extras / t.atendimentos : 0;
  t.produtoPorAtend = t.atendimentos ? t.produtos / t.atendimentos : 0;
  return t;
}
const ganhoEstimado = (t, p) => (t.servicos + t.extras) * (+p.comissao_servicos||0) / 100 + t.produtos * (+p.comissao_produtos||0) / 100;

// até onde o período "já aconteceu": se hoje ainda não tem lançamento, conta até ontem
function corte(p, temHoje){ const h = today(); const lim = temHoje ? h : addD(h, -1); return p.fim < lim ? p.fim : (p.ini > lim ? null : lim); }

// meta proporcional aos dias de trabalho entre ini e fim (cruza meses)
function metaNoIntervalo(metasDoBarbeiro, ini, fim){
  const r = { faturamento:0, extras:0, assinaturas:0, produtos:0, dias:0 };
  if (!ini || !fim || fim < ini) return r;
  const porMes = {}; (metasDoBarbeiro || []).forEach(m => porMes[String(m.mes).slice(0,10)] = m);
  for (let d = ini; d <= fim; d = addD(d, 1)) {
    if (!ehDiaUtil(d)) continue;
    r.dias++;
    const m = porMes[mesIni(d)]; if (!m) continue;
    const u = uteisNoMes(d);
    r.faturamento += (+m.faturamento||0) / u; r.extras += (+m.extras||0) / u; r.assinaturas += (+m.assinaturas||0) / u; r.produtos += (+m.produtos||0) / u;
  }
  return r;
}

const PESOS = { faturamento:4, extras:2, assinaturas:2, produtos:2 };
const COMP_NOME = { faturamento:"Faturamento", extras:"Serviços extras", assinaturas:"Assinaturas", produtos:"Produtos" };
function nivelDe(n){ return n == null ? null : n >= 8 ? "good" : n >= 6 ? "warn" : "bad"; }
const NIVEL_NOME = { good:"Muito bom", warn:"Médio", bad:"Ruim" };
// nota de 0 a 10: média ponderada de (real ÷ meta), 100% da meta = 9,0; acima de 111% = 10
function nota(t, meta){
  let soma = 0, pesos = 0; const comps = {};
  for (const k in PESOS) {
    if (!(meta[k] > 0)) continue;
    const r = t[k] / meta[k]; comps[k] = { r, real:t[k], meta:meta[k], nota:Math.min(10, r*9) };
    soma += PESOS[k] * Math.min(r, 1.25); pesos += PESOS[k];
  }
  if (!pesos) return { nota:null, comps };
  return { nota:Math.round(Math.min(10, soma / pesos * 9) * 10) / 10, comps };
}
function avaliar(lista, metasB, p){
  const t = totais(lista);
  const temHoje = lista.some(l => l.data === today());
  const c = corte(p, temHoje);
  const meta = metaNoIntervalo(metasB, p.ini, c);
  const metaCheia = metaNoIntervalo(metasB, p.ini, p.fim);
  const n = c ? nota(t, meta) : { nota:null, comps:{} };
  return { t, meta, metaCheia, corte:c, ...n, nivel:nivelDe(n.nota) };
}
function avaliarResumo(row, p){
  const t = comDerivados({ atendimentos:+row.atendimentos, servicos:+row.servicos, extras:+row.extras, qtd_extras:+row.qtd_extras, assinaturas:+row.assinaturas, produtos:+row.produtos, dias:+row.dias_lancados });
  const metasB = (typeof row.metas === "string" ? JSON.parse(row.metas) : row.metas) || [];
  const c = corte(p, true), meta = metaNoIntervalo(metasB, p.ini, c);
  const n = c ? nota(t, meta) : { nota:null };
  return { t, nota:n.nota, eu:row.eu };
}
function mediaEquipe(avals){
  const ativos = avals.filter(a => a.t.dias > 0);
  if (!ativos.length) return null;
  const m = {}; ["faturamento","servicos","extras","qtd_extras","assinaturas","produtos","atendimentos","dias"].forEach(k => m[k] = ativos.reduce((s,a) => s + a.t[k], 0) / ativos.length);
  comDerivados(m);
  const ns = ativos.filter(a => a.nota != null);
  m.nota = ns.length ? Math.round(ns.reduce((s,a) => s + a.nota, 0) / ns.length * 10) / 10 : null;
  m.n = ativos.length;
  return m;
}

function montarDicas(av){
  if (av.nivel == null) return [];
  const g = DICAS.geral[av.nivel].slice(0, 2).map(([b,s]) => ({ t:b, s }));
  const comps = Object.entries(av.comps).sort((a,b) => a[1].r - b[1].r);
  const especificas = comps.slice(0, 2).map(([k,c]) => ({ t:`${COMP_NOME[k]}: ${pctTxt(c.r)} da meta`, s:DICAS[k][nivelDe(c.nota)] }));
  return especificas.concat(g).slice(0, 4);
}
function frasePrincipal(av, nome){
  if (av.nivel == null) return "Ainda não há meta ou dias trabalhados neste período para dar a nota.";
  const fraco = Object.entries(av.comps).sort((a,b) => a[1].r - b[1].r)[0];
  const forte = Object.entries(av.comps).sort((a,b) => b[1].r - a[1].r)[0];
  if (av.nivel === "good") return `${nome ? nome + ", o" : "O"} período está muito bom. Destaque em ${COMP_NOME[forte[0]].toLowerCase()} (${pctTxt(forte[1].r)} da meta). Agora é manter e subir a régua.`;
  if (av.nivel === "warn") return `Período médio. O que mais puxa a nota para baixo é ${COMP_NOME[fraco[0]].toLowerCase()} (${pctTxt(fraco[1].r)} da meta). Corrigindo isso, a nota sobe.`;
  return `Período abaixo do esperado. ${COMP_NOME[fraco[0]]} está em ${pctTxt(fraco[1].r)} da meta. Siga as dicas abaixo a partir do próximo atendimento.`;
}

function gaugeSVG(n){
  // velocímetro de traços finos: vermelho → âmbar → verde até a nota; o resto apagado
  const v = n == null ? 0 : Math.max(0, Math.min(10, n)), cx = 130, cy = 132, r = 108, N = 64;
  const pt = (a, rr) => [cx + rr*Math.cos(a), cy - rr*Math.sin(a)];
  const mix = (a, b, t) => a.map((x, k) => Math.round(x + (b[k] - x) * t));
  const R_ = [242,88,91], A_ = [245,192,59], G_ = [163,224,95];
  const cor = f => { const c = f < .5 ? mix(R_, A_, f / .5) : mix(A_, G_, (f - .5) / .5); return `rgb(${c})`; };
  let tk = "";
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1), a = Math.PI * (1 - f), [x0,y0] = pt(a, r - 30), [x1,y1] = pt(a, r);
    const on = n != null && f <= v / 10 + 1e-9;
    tk += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${on ? cor(f) : "var(--off)"}" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  const marcas = [0, 5, 10].map(m => { const a = Math.PI * (1 - m/10), [x,y] = pt(a, r - 44); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="Outfit,sans-serif">${m}</text>`; }).join("");
  const ang = Math.PI * (1 - v/10), [nx, ny] = pt(ang, r - 8), [bx1, by1] = pt(ang + Math.PI/2, 4), [bx2, by2] = pt(ang - Math.PI/2, 4);
  return `<svg viewBox="0 0 260 146" aria-hidden="true">${tk}${marcas}
    ${n == null ? "" : `<polygon points="${bx1.toFixed(1)},${by1.toFixed(1)} ${nx.toFixed(1)},${ny.toFixed(1)} ${bx2.toFixed(1)},${by2.toFixed(1)}" fill="var(--ink)"/>`}
    <circle cx="${cx}" cy="${cy}" r="6" fill="var(--ink)" opacity="${n == null ? .3 : 1}"/>
  </svg>`;
}
function pill(nivel, txt){ return `<span class="pill ${nivel || "n"}">${txt}</span>`; }
function barra(r, marca, ritmo){
  const q = ritmo ? r / ritmo : r, nv = r == null ? "n" : q >= .89 ? "good" : q >= .67 ? "warn" : "bad";
  const x = Math.max(0, Math.min(1, r || 0)) * 5;
  return `<div class="sbar5 ${nv}">${Array.from({ length:5 }, (_, k) => `<i><b style="width:${Math.round(Math.max(0, Math.min(1, x - k)) * 100)}%"></b></i>`).join("")}</div>`;
}

function delta(v, ref, fmt){ if (ref == null || !isFinite(ref) || ref === 0) return ""; const d = v / ref - 1; return `<span class="${d >= 0 ? "good" : "bad"}">${d >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(d*100))}% vs média</span>`; }

function periodoBar(){
  const p = periodo(S.per.tipo, S.per.ref), futuro = moverPeriodo(p, 1) > today();

}

function cardRitmo(lancMes, metasB, perfil){
  const h = today(), mI = mesIni(h), mF = mesFim(h);
  const m = metasB.find(x => String(x.mes).slice(0,10) === mI);
  const t = totais(lancMes), temHoje = lancMes.some(l => l.data === h);
  const restantes = uteisEntre(temHoje ? addD(h, 1) : h, mF), feitos = uteisEntre(mI, temHoje ? h : addD(h, -1));
  const proj = feitos ? t.faturamento / feitos * (feitos + restantes) : 0;
  if (!m || !(+m.faturamento > 0)) return `<section class="card"><h2>Meta de ${pD(h).toLocaleDateString("pt-BR",{month:"long"})}</h2><p class="empty">${S.me.papel === "admin" ? "Defina a meta deste mês em Metas do mês." : "O admin ainda não definiu a sua meta deste mês."}</p></section>`;
  const falta = k => Math.max(0, (+m[k]||0) - t[k]);
  const ticket = t.ticket || (+perfil.ticket_medio || 0);
  const porDia = restantes ? falta("faturamento") / restantes : 0;
  const esperado = feitos / ((feitos + restantes) || 1);
  const linha = (rot, real, meta, fmt) => `<div><div class="row sm"><span>${rot}</span><span><b>${fmt(real)}</b> <span class="muted">de ${fmt(meta)}</span></span></div>${barra(meta ? real/meta : 0, esperado, esperado)}</div>`;
  return `<section class="card"><div class="row"><h2>Meta de ${pD(h).toLocaleDateString("pt-BR",{month:"long"})}</h2>${pill(proj >= +m.faturamento ? "good" : "warn", `Projeção ${money0(proj)}`)}</div>
    <span class="xs muted">A marca em cada barra mostra onde você deveria estar hoje.</span>
    <div class="grid" style="margin-top:10px">
      ${linha("Faturamento", t.faturamento, +m.faturamento, money0)}
      ${+m.extras ? linha("Serviços extras", t.extras, +m.extras, money0) : ""}
      ${+m.assinaturas ? linha("Assinaturas", t.assinaturas, +m.assinaturas, int) : ""}
      ${+m.produtos ? linha("Produtos", t.produtos, +m.produtos, money0) : ""}
    </div>
    <div class="calc-out">
      <div><span class="lbl">Falta faturar</span><div class="num">${money0(falta("faturamento"))}</div></div>

const _pos = [];

function corVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function graficoEvo(lista, metasB, p){
  const el = document.getElementById("chEvo"); if (!el || !window.Chart) return;
  const dias = (pD(p.fim) - pD(p.ini)) / 864e5 + 1;
  const modo = dias <= 31 ? "dia" : dias <= 186 ? "semana" : "mes";
  const baldes = [];
  if (modo === "dia") for (let d = p.ini; d <= p.fim; d = addD(d, 1)) baldes.push({ ini:d, fim:d, rot:dataBR(d) });
  else if (modo === "semana") { for (let d = p.ini; d <= p.fim; d = addD(d, 7)) { const f = addD(d, 6) > p.fim ? p.fim : addD(d, 6); baldes.push({ ini:d, fim:f, rot:dataBR(d) }); } }
  else for (let d = p.ini; d <= p.fim; d = addM(d, 1)) baldes.push({ ini:d, fim:mesFim(d), rot:pD(d).toLocaleDateString("pt-BR",{month:"short"}).replace(".","") });
  const fat = baldes.map(b => totais(lista.filter(l => l.data >= b.ini && l.data <= b.fim)).faturamento);
  const meta = baldes.map(b => Math.round(metaNoIntervalo(metasB, b.ini, b.fim).faturamento) || null);
  charts.push(new Chart(el, {
    data:{ labels:baldes.map(b => b.rot), datasets:[
      { type:"bar", label:"Faturamento", data:fat, backgroundColor:corVar("--accent"), borderRadius:4, maxBarThickness:28, order:2 },
      { type:"line", label:"Meta", data:meta, borderColor:corVar("--muted"), borderDash:[5,4], pointRadius:0, borderWidth:2, stepped:modo === "dia" ? false : "middle", spanGaps:true, order:1 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${money0(c.raw)}` } } },
      scales:{ x:{ grid:{ display:false }, ticks:{ color:corVar("--muted"), maxRotation:0, autoSkip:true, maxTicksLimit:10 } },
               y:{ beginAtZero:true, grid:{ color:corVar("--line") }, ticks:{ color:corVar("--muted"), callback:v => v >= 1000 ? (v/1000).toLocaleString("pt-BR") + " mil" : v } } } }
  }));
}

function graficoAcumulado(lista, linhas, p){

  }));
}

/* ======================= PÁGINA: MINHA META (CALCULADORA) ======================= */
async function pgCalc(){
  const me = S.equipe.find(e => e.id === S.me.id) || S.me;
  const h = today(), hist = await DB.lancamentos(addD(h, -90), h, me.id), t = totais(hist);
  const mixProd = t.faturamento ? t.produtos / t.faturamento : .08;
  const cs = (+me.comissao_servicos||0) / 100, cp = (+me.comissao_produtos||0) / 100;
  const taxa = (1 - mixProd) * cs + mixProd * cp;
  const ticket = +me.ticket_medio || t.ticket || 0;
  const ganho = +me.ganho_desejado || 0;
  const u = uteisNoMes(h);
  const fatNec = taxa ? ganho / taxa : 0;
  const m = metasDe(me.id).find(x => String(x.mes).slice(0,10) === mesIni(h));
  $("#psub").textContent = "Quanto você quer ganhar e o que precisa fazer para chegar lá";
  return `<section class="card"><h2>Quanto você quer ganhar no mês?</h2>
    <span class="sm muted">Sua comissão: ${numIn(me.comissao_servicos) || 0}% em serviços e extras e ${numIn(me.comissao_produtos) || 0}% em produtos (definida pelo admin).</span>
    <div class="fgrid" style="margin-top:12px">
      <label class="f">Ganho desejado no mês (R$)<input id="c-ganho" inputmode="decimal" value="${numIn(ganho)}" placeholder="ex.: 6000" data-in="calc"></label>
      <label class="f">Ticket médio (R$)<input id="c-ticket" inputmode="decimal" value="${numIn(+me.ticket_medio)}" placeholder="${t.ticket ? numIn(Math.round(t.ticket*100)/100) + " (seus últimos 90 dias)" : "ex.: 55"}" data-in="calc"></label>
    </div>
    <div id="calcOut">${calcOut(ganho, taxa, ticket, u, m)}</div>
    <div class="actions"><button class="btn" data-act="salvarCalc">Salvar minha meta</button></div>
  </section>
  <section class="card"><h3>Como a conta é feita</h3><p class="sm muted" style="margin:0">Faturamento necessário = ganho desejado ÷ comissão média (${pctTxt(taxa)}, considerando que ${pctTxt(mixProd)} do seu faturamento vem de produtos). Depois dividimos pelos ${u} dias de trabalho do mês e pelo ticket médio para chegar aos atendimentos por dia.</p></section>`;
}
function calcOut(ganho, taxa, ticket, u, m){
  if (!ganho || !taxa) return `<p class="empty">Preencha quanto quer ganhar para ver o faturamento necessário.</p>`;
  const fat = ganho / taxa, dia = fat / u;
  return `<div class="calc-out">
    <div><span class="lbl">Faturamento no mês</span><div class="num acc">${money0(fat)}</div></div>
    <div><span class="lbl">Por dia de trabalho</span><div class="num">${money0(dia)}</div><span class="xs muted">${u} dias no mês</span></div>
    <div><span class="lbl">Atendimentos por dia</span><div class="num">${ticket ? dec1(dia / ticket) : "—"}</div><span class="xs muted">${ticket ? "com ticket de " + money(ticket) : "informe o ticket médio"}</span></div>
    <div><span class="lbl">Por semana</span><div class="num">${money0(dia * CFG.dias_trabalho.length)}</div></div>
  </div>
  ${m && +m.faturamento ? `<div class="hero-dica ${fat > +m.faturamento ? "good" : "warn"}">${fat > +m.faturamento ? `Seu objetivo está acima da meta da barbearia (${money0(m.faturamento)}). Ótimo: batendo o seu, você bate a meta.` : `A meta da barbearia para você é ${money0(m.faturamento)}, acima do que você precisa para o seu ganho. Mire na meta da barbearia: ela rende ${money0(+m.faturamento * taxa)} para você.`}</div>` : ""}`;
}

  metaMes: v => { S.metaMes = addM(S.metaMes, +v); render(); },
  async salvarMetas(){ await DB.salvarMetas(lerMetas()); S.metas = await DB.metas(); toast("Metas salvas."); render(); },
  copiarMetas(){
    const ant = addM(S.metaMes, -1);
    let n = 0;
    document.querySelectorAll(".mrow").forEach(tr => { const x = S.metas.find(y => y.barbeiro_id === tr.dataset.b && String(y.mes).slice(0,10) === ant); if (!x) return; n++;
      ["faturamento","extras","produtos"].forEach(k => tr.querySelector(`[data-k="${k}"]`).value = numIn(x[k])); tr.querySelector('[data-k="assinaturas"]').value = x.assinaturas || ""; });
    toast(n ? "Copiado. Confira e toque em Salvar metas." : "O mês anterior não tem metas.");
  },
  igualarMetas(){
    const trs = [...document.querySelectorAll(".mrow")]; if (!trs.length) return;
    const base = {}; ["faturamento","extras","assinaturas","produtos"].forEach(k => base[k] = trs[0].querySelector(`[data-k="${k}"]`).value);
    trs.slice(1).forEach(tr => Object.entries(base).forEach(([k,v]) => tr.querySelector(`[data-k="${k}"]`).value = v));
    toast("Valores copiados. Toque em Salvar metas.");
  },
  async salvarLanc(){
    const g = id => $("#l-" + id).value, bid = S.me.papel === "admin" ? S.lancBarb : S.me.id;
    if (S.lancData > today()) return toast("Não dá para lançar um dia futuro.");
    const l = { barbeiro_id:bid, data:S.lancData, atendimentos:Math.round(parseNum(g("atendimentos"))), servicos:parseNum(g("servicos")), extras:parseNum(g("extras")),
      qtd_extras:Math.round(parseNum(g("qtd_extras"))), assinaturas:Math.round(parseNum(g("assinaturas"))), produtos:parseNum(g("produtos")), obs:g("obs").trim() || null };
    if (!l.atendimentos && !l.servicos && !l.extras && !l.produtos && !l.assinaturas) return toast("Preencha pelo menos um valor.");
    await DB.salvarLanc(l); toast(`Dia ${dataBR(S.lancData)} salvo.`); render();
  },
  async excluirLanc(){ if (!await confirmar("Excluir o lançamento deste dia?")) return; await DB.excluirLanc(S.me.papel === "admin" ? S.lancBarb : S.me.id, S.lancData); toast("Lançamento excluído."); render(); },
  async salvarCalc(){
    const campos = { ganho_desejado:parseNum($("#c-ganho").value), ticket_medio:parseNum($("#c-ticket").value) };
    await DB.salvarPerfil(S.me.id, campos); Object.assign(S.me, campos); const e = S.equipe.find(x => x.id === S.me.id); if (e) Object.assign(e, campos); toast("Meta pessoal salva.");
  },
  async convidar(){
    const nome = $("#n-nome").value.trim(), email = $("#n-email").value.trim().toLowerCase();
    if (!nome || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) && !(DEMO && /@/.test(email))) return toast("Preencha nome e um e-mail válido.");
    await DB.salvarConvite({ email, nome, papel:"barbeiro", comissao_servicos:parseNum($("#n-cs").value), comissao_produtos:parseNum($("#n-cp").value) });
    S.equipe = await DB.equipe();
    toast(DEMO ? `${nome} cadastrado.` : `${nome} cadastrado. Mande o link do app para ele criar a conta.`); render();
  },
  async excluirConvite(v){ if (!await confirmar("Cancelar este convite?")) return; await DB.excluirConvite(v); render(); },
  copiarLink(){ const url = location.origin + location.pathname; (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast("Link copiado."), () => toast("Link do app: " + url)); },
  async salvarPerfil(v){
    const g = k => document.querySelector(`[data-perfil="${v}"][data-k="${k}"]`).value;
    await DB.salvarPerfil(v, { comissao_servicos:parseNum(g("comissao_servicos")), comissao_produtos:parseNum(g("comissao_produtos")) });
    S.equipe = await DB.equipe(); toast("Comissão salva.");
  },
  async ativo(v){
    const b = S.equipe.find(e => e.id === v);
    if (b.ativo && !await confirmar(`Desativar ${b.nome}? Ele não aparece mais no ranking e não consegue lançar. Os dados ficam guardados.`)) return;
    await DB.salvarPerfil(v, { ativo:!b.ativo }); S.equipe = await DB.equipe(); render();
  },
  async aprovar(v){
    const g = k => document.querySelector(`[data-perfil="${v}"][data-k="${k}"]`).value;
    await DB.salvarPerfil(v, { aprovado:true, ativo:true, comissao_servicos:parseNum(g("comissao_servicos")), comissao_produtos:parseNum(g("comissao_produtos")) });
    S.equipe = await DB.equipe(); toast(`${nomeDe(v)} aprovado. Agora defina a meta dele em Metas do mês.`); render();
  },
  async recusar(v){
    if (!await confirmar(`Recusar ${nomeDe(v)}? Ele não vai conseguir usar o app. Dá para reativar depois na lista da equipe.`)) return;
    await DB.salvarPerfil(v, { aprovado:true, ativo:false }); S.equipe = await DB.equipe(); render();
  },
  dia: v => { v = +v; const s = new Set(CFG.dias_trabalho); s.has(v) ? s.delete(v) : s.add(v); if (!s.size) return; CFG.dias_trabalho = [...s].sort(); render(); },
  async salvarCfg(){ CFG.nome = $("#a-nome").value.trim() || "Barbearia"; await DB.salvarConfig(CFG); toast("Ajustes salvos."); render(); },
  async novaSenha(){ const s = prompt("Nova senha (mínimo 6 caracteres):"); if (!s) return; if (s.length < 6) return toast("A senha precisa de pelo menos 6 caracteres."); const { error } = await sb.auth.updateUser({ password:s }); toast(error ? "Erro: " + error.message : "Senha alterada."); },
  async sair(){ if (DEMO) lsSet("bp-demo-user", null); else await sb.auth.signOut(); location.reload(); },
  async resetDemo(){ if (!await confirmar("Apagar os dados da demonstração e gerar novos?")) return; try { localStorage.removeItem("bp-demo"); } catch(e) {} demoDB = null; location.reload(); },
  async demoEntrar(v){ lsSet("bp-demo-user", v); location.reload(); },
};
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-act]"); if (!t) return;
  if (t.dataset.tab) { if (t.dataset.tab === "equipe" || t.dataset.tab === "dashboard") S.ver = null; ir(t.dataset.tab); return; }
  const fn = ACOES[t.dataset.act]; if (!fn) return;
  if (t.tagName === "BUTTON") t.disabled = true;
  try { await fn(t.dataset.v); } catch (err) { console.error(err); toast("Erro: " + (err.message || err)); }
  finally { if (t.tagName === "BUTTON" && document.contains(t)) t.disabled = false; }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.ch; if (!k) return;
  if (k === "lancData") { if (!e.target.value) return; S.lancData = e.target.value > today() ? today() : e.target.value; }
  if (k === "lancBarb") S.lancBarb = e.target.value;
  render();
});
document.addEventListener("input", e => {
  if (e.target.dataset.in !== "calc") return;
  const me = S.equipe.find(x => x.id === S.me.id) || S.me;
  const tk = parseNum($("#c-ticket").value) || parseNum($("#c-ticket").placeholder);
  pgCalc._t && clearTimeout(pgCalc._t);
  pgCalc._t = setTimeout(async () => {
    const h = today(), t = totais(await DB.lancamentos(addD(h, -90), h, me.id)), mix = t.faturamento ? t.produtos / t.faturamento : .08;
    const taxa = (1 - mix) * (+me.comissao_servicos||0) / 100 + mix * (+me.comissao_produtos||0) / 100;
    const out = $("#calcOut"); if (out) out.innerHTML = calcOut(parseNum($("#c-ganho").value), taxa, tk || t.ticket, uteisNoMes(h), metasDe(me.id).find(x => String(x.mes).slice(0,10) === mesIni(h)));
  }, 200);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") menu(false); });

/* ======================= LOGIN ======================= */
function telaLogin(modo, msg){
  const R = $("#authRoot"); R.hidden = false; $("#app").hidden = true;
  if (DEMO) {
    const eq = demoLoad().equipe;
    R.innerHTML = `<div class="auth"><div class="auth-box"><img src="icons/logo.png" alt="Bold Performance" width="300" height="198">
      ${msg ? `<div class="auth-msg" style="background:var(--accent-soft)">${msg}</div>` : ""}
      <div class="auth-msg"><b>Modo demonstração.</b> Dados fictícios, salvos só neste aparelho. Escolha com qual conta entrar:</div>
      <button class="btn" data-act="demoEntrar" data-v="adm">Entrar como admin (Vinicius)</button>
      ${eq.filter(e => e.papel === "barbeiro").map(b => `<button class="btn ghost" data-act="demoEntrar" data-v="${b.id}">Entrar como ${esc(b.nome)}${b.aprovado === false ? " (cadastro novo)" : ""}</button>`).join("")}
    </div></div>`;
    return;
  }
  const titulos = { entrar:"Entrar", criar:"Criar conta", esqueci:"Recuperar senha" };
  R.innerHTML = `<div class="auth"><form class="auth-box" id="authForm" novalidate><img src="icons/logo.png" alt="Bold Performance" width="300" height="198">
    ${msg ? `<div class="auth-msg">${msg}</div>` : ""}
    ${modo === "criar" ? `<p class="sm muted" style="margin:0">Crie a sua conta. O admin recebe o seu cadastro e libera o acesso.</p><label class="f">Seu nome<input id="au-nome" autocomplete="name" required></label>` : ""}
    <label class="f">E-mail<input type="email" id="au-email" autocomplete="email" required></label>
    ${modo !== "esqueci" ? `<label class="f">Senha<input type="password" id="au-senha" autocomplete="${modo === "criar" ? "new-password" : "current-password"}" minlength="6" required></label>` : ""}
    <button class="btn" type="submit">${titulos[modo]}</button>
    <div class="auth-links">${modo === "entrar" ? `<button type="button" class="link" data-auth="criar">Criar conta</button><button type="button" class="link" data-auth="esqueci">Esqueci a senha</button>` : `<button type="button" class="link" data-auth="entrar">Voltar para entrar</button>`}</div>
  </form></div>`;
  R.querySelectorAll("[data-auth]").forEach(b => b.onclick = () => telaLogin(b.dataset.auth));
  $("#authForm").onsubmit = async ev => {
    ev.preventDefault();
    const email = $("#au-email").value.trim(), senha = $("#au-senha") && $("#au-senha").value;
    const btn = ev.target.querySelector("button[type=submit]"); btn.disabled = true;
    try {
      if (modo === "entrar") { const { error } = await sb.auth.signInWithPassword({ email, password:senha }); if (error) throw error; await iniciar(); }
      else if (modo === "criar") {
        if (!senha || senha.length < 6) throw new Error("A senha precisa de pelo menos 6 caracteres.");
        const nome = ($("#au-nome").value || "").trim(); if (!nome) throw new Error("Preencha o seu nome.");
        const { data, error } = await sb.auth.signUp({ email, password:senha, options:{ emailRedirectTo:location.origin + location.pathname, data:{ app:"bold", nome } } }); if (error) throw error;
        if (data.session) await iniciar(); else telaLogin("entrar", "Conta criada. Confirme pelo link que enviamos para o seu e-mail e depois entre aqui. O admin precisa aprovar o seu acesso.");
      } else { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:location.origin + location.pathname }); if (error) throw error; telaLogin("entrar", "Enviamos um link para criar uma nova senha."); }
    } catch (err) {
      const m = /Invalid login/i.test(err.message) ? "E-mail ou senha incorretos." : /confirm/i.test(err.message) ? "Confirme o seu e-mail pelo link que enviamos antes de entrar." : err.message;
      telaLogin(modo, esc(m));
    } finally { btn.disabled = false; }
  };
}

async function iniciar(){
  let me;
  try { me = await DB.me(); } catch (e) { console.error(e); return telaLogin("entrar", "Não foi possível conectar. Verifique a internet."); }
  if (!me) return telaLogin("entrar");
  if (me.semPerfil) { await sb.auth.signOut(); return telaLogin("entrar", `A conta <b>${esc(me.email)}</b> ainda não foi liberada. Peça para o admin cadastrar este e-mail em Barbeiros.`); }
  if (me.aprovado === false) { if (!DEMO) await sb.auth.signOut(); else lsSet("bp-demo-user", null); return telaLogin("entrar", `Olá, ${esc(primeiroNome(me.nome))}! Seu cadastro foi enviado para o admin. Assim que ele aprovar, é só entrar de novo.`); }
  if (!me.ativo) { if (!DEMO) await sb.auth.signOut(); else lsSet("bp-demo-user", null); return telaLogin("entrar", "Esta conta está desativada. Fale com o admin."); }
  S.me = me;
  await carregarBase();
  S.tab = S.me.papel === "admin" ? "dashboard" : "painel";
  $("#authRoot").hidden = true; $("#app").hidden = false;
  if (DEMO) { const b = $("#demoband"); b.hidden = false; b.innerHTML = `Modo demonstração · dados fictícios<button data-act="sair">Trocar conta</button>`; }
  render();
}
if (sb) sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") setTimeout(() => ACOES.novaSenha(), 300); });
iniciar();
</script>

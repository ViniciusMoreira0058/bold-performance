<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bold Performance</title>
<meta name="description" content="Performance dos barbeiros: metas do mês, faturamento, extras, assinaturas e produtos, nota por período e dicas para melhorar.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bold">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout: menu lateral fixo no computador (≥ 960px), barra inferior no celular */
:root{
  --bg:#070707;--surface:#151515;--surface-2:#1e1e1e;--ink:#f4f4f2;--muted:#8b8b8b;--line:#262626;--shadow:none;--off:#2a2a2a;
  --accent:#ff751f;--accent-ink:#ff8a3d;--accent-soft:#2a1608;--on-accent:#000000;
  --good:#a3e05f;--good-soft:#1a2610;--warn:#f5c03b;--warn-soft:#2b230c;--bad:#f2585b;--bad-soft:#2e1213;
  --side:#070707;--side-line:#1c1c1c;--side-hover:#151515;
  --display:"Outfit",system-ui,sans-serif;--body:"Outfit",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#efefed;--surface:#ffffff;--surface-2:#f3f3f1;--ink:#0a0a0a;--muted:#6b6b6b;--line:#e3e3e0;--shadow:0 1px 2px rgba(0,0,0,.05);--off:#e2e2df;
  --accent:#ff751f;--accent-ink:#c2510a;--accent-soft:#fff0e6;--on-accent:#000000;
  --good:#4c9a1c;--good-soft:#e8f4dc;--warn:#b07d06;--warn-soft:#f8eedd;--bad:#d1343a;--bad-soft:#f9e4e2;
  --side:#000000;--side-line:#1c1c1c;--side-hover:#141414;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
svg.ic{width:20px;height:20px;flex:0 0 20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- estrutura ---------- */
.app{display:block;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.shell{min-width:0}
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent}
.top-in{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:1160px;margin:0 auto}
.top h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;margin:0;line-height:1.15;letter-spacing:-.01em;text-transform:uppercase}
.top .sub{font-size:13px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
main{display:flex;flex-direction:column;gap:16px;padding:6px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));max-width:1160px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;width:min(86vw,290px);z-index:50;background:var(--side);border-right:1px solid var(--side-line);padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-105%);visibility:hidden;overflow-y:auto;color:#f5f5f5}
.app.menu-open .side{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.4)}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.app.menu-open .scrim{display:block}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .25s ease,visibility .25s}.bar>span,.mbar>span{transition:width .5s ease}}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.brand img{width:150px;height:auto;display:block}
.brand .fechar{margin-left:auto}
.side-label{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:#7a7a7a;padding:12px 10px 4px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#a3a3a3;font:600 14.5px var(--body);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left}
.nav-i:hover{background:var(--side-hover);color:#fff}
.nav-i[aria-current="page"]{background:var(--accent);color:#000}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--side-line);padding-top:12px}
.user{display:flex;align-items:center;gap:10px;padding:4px 8px 8px;min-width:0}
.user b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user span{font-size:12px;color:#8a8a8a}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;font:800 italic 14px var(--display);flex:0 0 34px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#000;border-top:1px solid #1c1c1c;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:#8a8a8a;font:600 11px var(--body);padding:6px 2px;border-radius:8px;cursor:pointer;min-width:0}
.bottom button[aria-current="page"]{color:var(--accent)}
/* rodapé sem fundo: só o velocímetro flutuando no canto direito */
.bottom{justify-content:flex-end;align-items:center;background:none;border-top:0;pointer-events:none}
.bottom .bnav-marca{pointer-events:auto}
.bottom{padding:0 6px env(safe-area-inset-bottom,0px);height:calc(48px + env(safe-area-inset-bottom,0px))}
.bottom .bnav-marca{flex:0 0 auto;display:grid;place-items:center;height:48px;padding:0 14px 0 24px;margin:0;color:var(--accent)}
.bottom .bnav-marca .sym{display:block}
.bottom .bnav-marca .sym{width:44px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8)) drop-shadow(0 0 12px rgba(255,117,31,.35))}
.bottom .bnav-marca:active .sym{transform:scale(.94)}
.mlogo img{height:22px;width:auto;display:block;margin-bottom:2px}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;padding-bottom:0}
  .side{position:sticky;top:0;height:100vh;width:auto;transform:none;visibility:visible;z-index:1;box-shadow:none!important}
  .burger,.scrim,.bottom,.mlogo{display:none!important}
  main{padding:6px 32px 48px}
  .top-in{padding:24px 32px 12px}
  .top h1{font-size:26px}
}

/* ---------- componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font:800 italic 17px var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px}
.card h3{font:700 15px var(--display);margin:0 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.sm{font-size:13px}.xs{font-size:12px}.muted{color:var(--muted)}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--accent-ink)}
.num{font:800 italic 24px var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.lbl{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#000;font:800 italic 14px var(--display);text-transform:uppercase;letter-spacing:.02em;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-style:normal;font-weight:700;text-transform:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-style:normal;font-weight:600;text-transform:none}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line);font-style:normal;font-weight:600;text-transform:none}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--ink)}
.side .icon-btn{background:#0e0e0e;border-color:#262626;color:#f5f5f5}
.link{border:0;background:none;color:var(--accent-ink);font:600 13px var(--body);cursor:pointer;padding:0}
label.f{display:flex;flex-direction:column;gap:5px;font:600 13px var(--body);color:var(--muted);min-width:0}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.n{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bar.good>span{background:var(--good)}.bar.warn>span{background:var(--warn)}.bar.bad>span{background:var(--bad)}
.loading{color:var(--muted);text-align:center;padding:40px 16px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font:600 14px var(--body);z-index:100;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
@media (min-width:960px){.toast{bottom:24px}}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.demo-band{background:var(--accent);color:#000;font:700 12.5px var(--body);text-align:center;padding:6px 12px}
.demo-band button{border:0;background:#000;color:var(--accent);font:700 12px var(--body);border-radius:6px;padding:2px 8px;margin-left:8px;cursor:pointer}

/* período */
.pbar{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:700 13px var(--body);padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#000}
.pnav{display:flex;align-items:center;gap:10px}
.pnav b{flex:1;text-align:center;font:800 italic 15px var(--display);text-transform:uppercase}
.pnav .icon-btn{font-size:20px;line-height:1}
.pnav .icon-btn:disabled{opacity:.35;cursor:default}

/* nota */
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center}
@media (min-width:720px){.hero{grid-template-columns:260px 1fr}}
.gauge{position:relative;width:100%;max-width:260px;margin:0 auto}
.gauge svg{width:100%;height:auto;display:block}
.gauge .gv{text-align:center;margin-top:-4px}
.gauge .gv b{display:block;font:900 italic 46px var(--display);line-height:1;letter-spacing:-.02em}
.gauge .gv span{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase}
.hero-txt h2{font-size:22px}
/* velocímetros de serviços extras e produtos: embaixo da nota no celular, ao lado dela na tela larga */
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.mini{text-align:center;min-width:0}
.modal.priv{z-index:95;overflow:auto;place-items:start center}
.modal.priv>.priv-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;max-width:640px;width:100%;margin:16px 0;font-size:14.5px;line-height:1.55}
.priv-box h2{margin:0 0 4px;font-size:22px}.priv-box h3{font-size:15px;margin:18px 0 6px;color:var(--accent-ink)}
.priv-box p{margin:0 0 8px;font-size:14.5px}.priv-box ul{margin:0 0 8px;padding-left:20px}.priv-box li{margin:3px 0}
.aceite{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);text-align:left}
.aceite input{width:20px;height:20px;min-height:0;flex:0 0 20px;margin-top:1px;accent-color:var(--accent)}
.aceite .link{display:inline;padding:0;font-size:inherit}
.metas-ind{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;margin-top:14px}@media (min-width:960px){.metas-ind{grid-template-columns:repeat(4,minmax(0,1fr))}}
.metas-ind .mi{display:flex;flex-direction:column;gap:6px;min-width:0}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font:700 11px var(--body);display:inline-grid;place-items:center}
.falta{padding:14px 0;border-bottom:1px solid var(--line)}.falta:last-child{border-bottom:0}
.falta.quente{border-left:3px solid var(--bad);padding-left:12px}
.falta-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.falta-top b{font-size:16px}
.falta-resp{margin-top:10px;background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.falta-resp b{color:var(--accent-ink)}.falta-resp.ok b{color:var(--good)}
.pill.urg.u4{background:var(--bad);color:#fff}
.chips.urg-chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}@media (min-width:720px){.chips.urg-chips{grid-template-columns:repeat(4,minmax(0,1fr))}}
.urg-chips .chip{width:100%;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.urg-chips .chip span{font-size:11px;opacity:.75;font-weight:500}
.chip.sm{font-size:12px;padding:6px 10px;min-height:0}
.falta-box{text-align:left}.falta-box h2{text-align:center}.falta-box .xs.muted{text-align:center;display:block}
.falta-lista{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;max-height:50vh;overflow:auto}
.falta-lista>div{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.falta-lista>div>span.xs,.falta-lista>div>span.sm{flex-basis:100%}
.chips.func-chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:460px}
.func-chips .chip{width:100%;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.func-chips .chip span{font-size:11px;opacity:.75;font-weight:500}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pods{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}
@media (min-width:720px){.pods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pod-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.pods.rk li{grid-template-rows:auto auto;row-gap:4px}
.rk-sub{grid-column:3 / -1;display:flex;flex-direction:column;gap:3px;min-width:0}
.rk-sub .sbar5{height:6px}
.sbar5.acc b{background:var(--accent)}
.rk-nota{display:block;margin-top:10px}
.pods.rk ol{gap:12px}
.pod{background:var(--surface-2);border-radius:16px;padding:12px 14px;min-width:0}
.pod ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.pod li{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;align-items:center;gap:8px;cursor:pointer}
.pod li>b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod li>span{font-weight:600;font-variant-numeric:tabular-nums}
.pod li>i{font-style:normal;font:700 12px var(--display);width:28px;height:22px;border-radius:999px;display:grid;place-items:center;background:var(--off);color:var(--muted)}
.pod li>i.m1{background:var(--accent);color:var(--on-accent)}.pod li>i.m2{background:color-mix(in srgb,var(--accent) 45%,var(--off));color:var(--ink)}
.dicas.fb .dica i.good{background:var(--good-soft);color:var(--good)}.dicas.fb .dica i.warn{background:var(--warn-soft);color:var(--warn)}
.fbb{padding:14px 0;border-bottom:1px solid var(--line)}.fbb:last-child{border-bottom:0}
.fbb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.fb-aviso{border-color:var(--accent)}
.mini .gauge{max-width:170px}
.mini .gauge .gv b{font-size:30px}
.mini .gauge .gv span{font-size:10px}
.mini .mt{display:block;font-weight:600;font-size:14px;margin-top:6px}
.mini .ms{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.mini .ms{display:block}.mini .ct,.m-nota{display:none}
/* celular: painel de carro, nota no centro e os dois menores dos lados; os textos numa linha só embaixo */
@media (max-width:719px){
  .hero.com-minis{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"ex nota pr" "ext notat prt" "txt txt txt";column-gap:6px;row-gap:0;align-items:end}
  .hero.com-minis>.gauge{grid-area:nota;max-width:none}
  .hero.com-minis .minis,.hero.com-minis .mini{display:contents}
  .hero.com-minis .m-ex>.gauge{grid-area:ex}.hero.com-minis .m-pr>.gauge{grid-area:pr}
  .hero.com-minis .m-ex>.mtx{grid-area:ext}.hero.com-minis .m-pr>.mtx{grid-area:prt}
  .hero.com-minis .m-nota{display:block;grid-area:notat}
  .hero.com-minis .mtx{align-self:start;text-align:center;padding-top:8px;min-width:0}
  .hero.com-minis .mini .lg{display:none}.hero.com-minis .mini .ct{display:inline}
  .hero.com-minis>.hero-txt{grid-area:txt;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .hero.com-minis>.gauge .gv b{font-size:40px}
  .hero.com-minis>.gauge .gv span{font-size:10px}
  .hero.com-minis .mini .gauge{max-width:none}
  .hero.com-minis .mini .gauge .gv b{font-size:22px}
  .hero.com-minis .mini .gauge .gv span{font-size:8px;letter-spacing:.06em}
  .hero.com-minis .mtx .mt{display:block;font-weight:600;font-size:12.5px}
  .hero.com-minis .mtx .ms{display:block;font-size:11px;color:var(--muted);line-height:1.35}
  .hero.com-minis .gsvg text{display:none}
}
@media (min-width:1180px){.hero.com-minis{grid-template-columns:240px minmax(0,1fr) 360px}.hero.com-minis .minis{margin-top:0;padding-top:0;border-top:0;padding-left:18px;border-left:1px solid var(--line)}}
.cmp{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.cmp .pill{font-size:12.5px}

/* KPIs */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .num{font-size:22px;word-break:break-word}
.kpi .meta{display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.kpi .meta>span{white-space:normal;overflow-wrap:anywhere}

/* dicas */
.dicas{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.dica{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.dica i{font-style:normal;flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--display);background:var(--accent);color:#000}

function gerarDemo(){
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const barbs = [
    { id:"b1", nome:"Lucas Andrade", nivel:1.12, cs:50, cp:10 },
    { id:"b2", nome:"Rafael Souza",  nivel:.95,  cs:50, cp:10 },
    { id:"b3", nome:"Diego Lima",    nivel:.66,  cs:45, cp:10 },
    { id:"b4", nome:"Mateus Rocha",  nivel:.84,  cs:45, cp:10 },
  ];
  const equipe = [{ id:"adm", nome:"Vinicius", email:"admin@demo", papel:"admin", ativo:true, comissao_servicos:0, comissao_produtos:0, ganho_desejado:0, ticket_medio:0 }]
    .concat(barbs.map((b,i) => ({ id:b.id, nome:b.nome, email:`barbeiro${i+1}@demo`, papel:"barbeiro", ativo:true, comissao_servicos:b.cs, comissao_produtos:b.cp, ganho_desejado:[6500,5500,5000,5200][i], ticket_medio:0 })));
  const metas = [], lanc = [], hoje = today(), ini = addM(mesIni(hoje), -9);
  for (let m = ini; m <= mesIni(hoje); m = addM(m, 1)) barbs.forEach((b,i) => metas.push({ barbeiro_id:b.id, mes:m, faturamento:[19000,17500,17000,17000][i], extras:[2800,2500,2300,2300][i], assinaturas:0, produtos:[900,750,650,650][i] }));
  for (let d = ini; d <= hoje; d = addD(d, 1)) {
    const dow = pD(d).getDay(); if (dow === 0) continue;
    if (d === hoje && new Date().getHours() < 20) continue;
    barbs.forEach(b => {
      if (rnd() < .05) return;
      const sab = dow === 6 ? 1.35 : 1, ev = (pD(d).getMonth() % 3 === 1 ? .95 : 1.03) * b.nivel;
      const at = Math.max(3, Math.round((10 + rnd()*6) * sab * ev));
      const servicos = Math.round(at * (40 + rnd()*12));
      const qtd_extras = Math.round(at * (.18 + rnd()*.22) * ev);
      lanc.push({ barbeiro_id:b.id, data:d, atendimentos:at, servicos, extras:Math.round(qtd_extras*(28+rnd()*14)), qtd_extras,
        assinaturas: rnd() < .27*ev ? 1 : 0, produtos: rnd() < .55 ? Math.round((25 + rnd()*90) * ev) : 0, assinatura_rs: rnd() < .3*ev ? 129 : 0, obs:"" });
    });
  }
  equipe.push({ id:"b5", nome:"Pedro Alves", email:"pedro@demo", papel:"barbeiro", ativo:false, aprovado:false, comissao_servicos:50, comissao_produtos:10, ganho_desejado:0, ticket_medio:0 });
  return { v:4, config:{ nome:"Barbearia Demo", dias_trabalho:[1,2,3,4,5,6] }, equipe, convites:[], metas, lanc, metasLoja:[{ mes:mesIni(hoje), faturamento:75000 }] };
}

const TIPOS = [["dia","Diário"],["semana","Semanal"],["quinzena","Quinzenal"],["mes","Mensal"],["trimestre","Trimestral"],["semestre","Semestral"],["ano","Anual"]];
const TIPO_NOME = Object.fromEntries(TIPOS);
function periodo(tipo, ref){
  const d = pD(ref), y = d.getFullYear(), m = d.getMonth();
  let ini, fim, label;
  if (tipo === "dia") { ini = fim = ref; label = ref === today() ? "Hoje" : ref === addD(today(), -1) ? "Ontem" : pD(ref).toLocaleDateString("pt-BR", {weekday:"short", day:"2-digit", month:"short"}); }
  else if (tipo === "semana") { const dow = (d.getDay() + 6) % 7; ini = addD(ref, -dow); fim = addD(ini, 6); label = `${dataBR(ini)} a ${dataBR(fim)}`; }
  else if (tipo === "quinzena") { if (d.getDate() <= 15) { ini = iso(new Date(y, m, 1)); fim = iso(new Date(y, m, 15)); } else { ini = iso(new Date(y, m, 16)); fim = mesFim(ref); } label = `${dataBR(ini)} a ${dataBR(fim)}`; }
  else if (tipo === "mes") { ini = mesIni(ref); fim = mesFim(ref); label = mesNome(ref); }
  else if (tipo === "trimestre") { const q = Math.floor(m/3); ini = iso(new Date(y, q*3, 1)); fim = iso(new Date(y, q*3+3, 0)); label = `${q+1}º trimestre ${y}`; }
  else if (tipo === "semestre") { const s = m < 6 ? 0 : 1; ini = iso(new Date(y, s*6, 1)); fim = iso(new Date(y, s*6+6, 0)); label = `${s+1}º semestre ${y}`; }
  else { ini = `${y}-01-01`; fim = `${y}-12-31`; label = String(y); }
  return { tipo, ref, ini, fim, label };
}
function moverPeriodo(p, dir){
  const passo = { dia:[0,1], semana:[0,7], quinzena:null, mes:[1], trimestre:[3], semestre:[6], ano:[12] }[p.tipo];
  if (p.tipo === "quinzena") return dir > 0 ? addD(p.fim, 1) : addD(p.ini, -1);
  if (p.tipo === "dia" || p.tipo === "semana") return addD(p.ini, dir * passo[1]);
  return addM(p.ini, dir * passo[0]);
}

let CFG = { nome:"Barbearia", dias_trabalho:[1,2,3,4,5,6] };
const ehDiaUtil = s => CFG.dias_trabalho.includes(pD(s).getDay());
const _uteisMes = {};
// receita de assinaturas no mês: realizado e projeção pelos dias corridos (as cobranças caem todo dia)
// com assinaturas lançadas por barbeiro, a planilha não soma de novo no faturamento da barbearia
function assinLoja(asL, doMes, ini, fim){ return doMes.some(l => +l.assinatura_rs > 0) ? { tem:false, valor:0, proj:0, cobrancas:0 } : resumoAssin(asL, ini, fim); }
const faltaColuna = e => /assinatura_rs/.test(e.message || "") ? new Error("Falta rodar o arquivo 009_assinatura_barbeiro.sql no Supabase.") : /comissao_rs/.test(e.message || "") ? new Error("Falta rodar o arquivo 010_comissao.sql no Supabase.") : e;
function resumoAssin(lista, ini, fim){
  const valor = lista.reduce((s, x) => s + (+x.valor || 0), 0), cobrancas = lista.reduce((s, x) => s + (+x.cobrancas || 0), 0);
  const ult = lista.length ? lista.map(x => String(x.data).slice(0, 10)).sort().at(-1) : null;
  const corridos = ult ? Math.round((pD(ult) - pD(ini)) / 864e5) + 1 : 0, total = Math.round((pD(fim) - pD(ini)) / 864e5) + 1;
  return { valor, cobrancas, proj:corridos ? valor / corridos * total : 0, tem:lista.length > 0 };
}
function metaLoja(m){ const x = (S.metasLoja || []).find(y => String(y.mes).slice(0,10) === mesIni(m)); return x ? +x.faturamento || 0 : 0; }
function uteisNoMes(m){ m = mesIni(m); if (_uteisMes[m + CFG.dias_trabalho]) return _uteisMes[m + CFG.dias_trabalho]; let n = 0; for (let d = m, f = mesFim(m); d <= f; d = addD(d, 1)) if (ehDiaUtil(d)) n++; return _uteisMes[m + CFG.dias_trabalho] = n || 1; }
function uteisEntre(a, b){ let n = 0; for (let d = a; d <= b; d = addD(d, 1)) if (ehDiaUtil(d)) n++; return n; }

function totais(lista){
  const t = { atendimentos:0, servicos:0, extras:0, qtd_extras:0, assinaturas:0, produtos:0, assinatura_rs:0, comissao_rs:0, dias:0 };
  for (const l of lista) { t.atendimentos += +l.atendimentos||0; t.servicos += +l.servicos||0; t.extras += +l.extras||0; t.qtd_extras += +l.qtd_extras||0; t.assinaturas += +l.assinaturas||0; t.produtos += +l.produtos||0; t.assinatura_rs += +l.assinatura_rs||0; t.comissao_rs += +l.comissao_rs||0; t.dias++; }
  return comDerivados(t);
}
function comDerivados(t){
  t.faturamento = t.servicos + t.extras + t.produtos + (t.assinatura_rs || 0);
  t.ticket = t.atendimentos ? t.faturamento / t.atendimentos : 0;
  t.extraPorAtend = t.atendimentos ? t.qtd_extras / t.atendimentos : 0;
  t.produtoPorAtend = t.atendimentos ? t.produtos / t.atendimentos : 0;
  return t;
}
const parte = (v, tot) => tot ? v / tot : 0;
const ganhoEstimado = (t, p) => (t.servicos + t.extras) * (+p.comissao_servicos||0) / 100 + t.produtos * (+p.comissao_produtos||0) / 100;

// até onde o período "já aconteceu": se hoje ainda não tem lançamento, conta até ontem
function corte(p, temHoje){ const h = today(); const lim = temHoje ? h : addD(h, -1); return p.fim < lim ? p.fim : (p.ini > lim ? null : lim); }

// meta proporcional aos dias de trabalho entre ini e fim (cruza meses)
function metaNoIntervalo(metasDoBarbeiro, ini, fim){
  const r = { faturamento:0, extras:0, assinaturas:0, produtos:0, dias:0 };
  if (!ini || !fim || fim < ini) return r;
  const porMes = {}; (metasDoBarbeiro || []).forEach(m => porMes[String(m.mes).slice(0,10)] = m);
  for (let d = ini; d <= fim; d = addD(d, 1)) {
    if (!ehDiaUtil(d)) continue;
    r.dias++;
    const m = porMes[mesIni(d)]; if (!m) continue;
    const u = uteisNoMes(d);
    r.faturamento += (+m.faturamento||0) / u; r.extras += (+m.extras||0) / u; r.assinaturas += (+m.assinaturas||0) / u; r.produtos += (+m.produtos||0) / u;
  }
  return r;
}

// a nota: 60% faturamento contra a meta, 20% serviços extras e 20% produtos
const PESOS = { faturamento:.6, extras:.2, produtos:.2 };
// participação média de extras e produtos no faturamento da equipe (últimos 90 dias): a régua de quem não tem meta do item
let MIX = { extras:0, produtos:0 };
const COMP_NOME = { faturamento:"Faturamento", extras:"Serviços extras", assinaturas:"Assinaturas", produtos:"Produtos" };
function nivelDe(n){ return n == null ? null : n >= 8 ? "good" : n >= 6 ? "warn" : "bad"; }
const NIVEL_NOME = { good:"Muito bom", warn:"Médio", bad:"Ruim" };
// nota de 0 a 10: média ponderada de cada item contra a sua régua; 100% = 9,0; acima de 111% = 10 (cada item conta no máximo 125%)
// faturamento: contra a meta. Extras e produtos: contra a meta do item; sem ela, a parte do faturamento que veio
// do item contra a parte média da equipe (assim quem tem menos clientes também sobe vendendo bem)
function nota(t, meta){
  let soma = 0, pesos = 0; const comps = {};
  for (const k in PESOS) {
    let r = null, ref = "da meta";
    if (meta[k] > 0) r = t[k] / meta[k];
    else if (k !== "faturamento" && MIX[k] > 0 && t.faturamento > 0) { r = t[k] / t.faturamento / MIX[k]; ref = "da média da equipe"; }
    if (r == null) continue;
    comps[k] = { r, ref, real:t[k], meta:meta[k], nota:Math.round(Math.min(10, r * 9) * 10) / 10 };
  }
  if (!comps.faturamento) return { nota:null, comps };  // sem meta de faturamento não tem nota
  for (const k in comps) { soma += PESOS[k] * Math.min(comps[k].r, 1.25); pesos += PESOS[k]; }
  return { nota:Math.round(Math.min(10, soma / pesos * 9) * 10) / 10, comps };
}
// velocímetro de um item (serviços extras ou produtos): a mesma conta que entra na nota
const notaItem = c => c ? { nota:c.nota, r:c.r, ref:c.ref } : { nota:null, r:null, ref:"" };
// .lg = texto inteiro (tela larga) · .ct = versão curta (painel de carro no celular)
function miniGauge(cls, titulo, curto, real, it){

    <div class="mtx"><span class="mt"><span class="lg">${titulo}</span><span class="ct">${curto}</span></span><span class="ms">${money0(real)}</span>${it.r == null ? "" : `<span class="ms">${pctTxt(it.r)} <span class="lg">${it.ref === "da média da equipe" ? "da média (proporcional)" : it.ref}</span><span class="ct">${it.ref.replace(" da equipe", "")}</span></span>`}</div></div>`;
}
function avaliar(lista, metasB, p){
  const t = totais(lista);
  const temHoje = lista.some(l => l.data === today());
  const c = corte(p, temHoje);
  const meta = metaNoIntervalo(metasB, p.ini, c);
  const metaCheia = metaNoIntervalo(metasB, p.ini, p.fim);
  const n = c ? nota(t, meta) : { nota:null, comps:{} };
  return { t, meta, metaCheia, corte:c, ...n, nivel:nivelDe(n.nota) };
}
function avaliarResumo(row, p){
  const t = comDerivados({ atendimentos:+row.atendimentos, servicos:+row.servicos, extras:+row.extras, qtd_extras:+row.qtd_extras, assinaturas:+row.assinaturas, produtos:+row.produtos, assinatura_rs:+row.assinatura_rs || 0, dias:+row.dias_lancados });

}

/* ======================= COMPONENTES ======================= */
function gaugeSVG(n){
  // velocímetro de traços finos: vermelho → âmbar → verde até a nota; o resto apagado
  const v = n == null ? 0 : Math.max(0, Math.min(10, n)), cx = 130, cy = 132, r = 108, N = 64;
  const pt = (a, rr) => [cx + rr*Math.cos(a), cy - rr*Math.sin(a)];
  const mix = (a, b, t) => a.map((x, k) => Math.round(x + (b[k] - x) * t));
  const R_ = [242,88,91], A_ = [245,192,59], G_ = [163,224,95];
  const cor = f => { const c = f < .5 ? mix(R_, A_, f / .5) : mix(A_, G_, (f - .5) / .5); return `rgb(${c})`; };
  let tk = "";
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1), a = Math.PI * (1 - f), [x0,y0] = pt(a, r - 30), [x1,y1] = pt(a, r);
    // começa apagado; animarGauges acende os traços até a nota junto com o ponteiro
    tk += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--off)" data-f="${f.toFixed(4)}" data-c="${cor(f)}" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  const marcas = [0, 5, 10].map(m => { const a = Math.PI * (1 - m/10), [x,y] = pt(a, r - 44); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="Outfit,sans-serif">${m}</text>`; }).join("");
  // ponteiro desenhado no 0 e girado até a nota
  const ang = Math.PI, [nx, ny] = pt(ang, r - 8), [bx1, by1] = pt(ang + Math.PI/2, 8), [bx2, by2] = pt(ang - Math.PI/2, 8);
  return `<svg viewBox="0 0 260 146" aria-hidden="true" class="gsvg" data-v="${n == null ? "" : v}">${tk}${marcas}
    ${n == null ? "" : `<g class="gp" transform="rotate(0 ${cx} ${cy})"><polygon points="${bx1.toFixed(1)},${by1.toFixed(1)} ${nx.toFixed(1)},${ny.toFixed(1)} ${bx2.toFixed(1)},${by2.toFixed(1)}" fill="var(--accent)"/></g>`}
    <circle cx="${cx}" cy="${cy}" r="11" fill="var(--accent)" opacity="${n == null ? .3 : 1}"/>
  </svg>`;
}
// velocímetros de nota: o ponteiro sai do 0 e vai até a nota, acendendo os traços e contando o número
function animarGauges(){
  document.querySelectorAll("svg.gsvg:not([data-ok])").forEach(svg => {
    svg.dataset.ok = "1";
    if (svg.dataset.v === "") return;
    const v = +svg.dataset.v, g = svg.querySelector(".gp"), num = svg.closest(".gauge")?.querySelector(".gv b");
    const linhas = [...svg.querySelectorAll("line[data-f]")], dur = 600 + v * 110, t0 = performance.now();
    const pinta = x => {
      if (g) g.setAttribute("transform", `rotate(${(x * 18).toFixed(2)} 130 132)`);
      linhas.forEach(l => { const on = +l.dataset.f <= x / 10 + 1e-9; l.setAttribute("stroke", on ? l.dataset.c : "var(--off)"); });
      if (num) num.textContent = dec1(x);
    };
    const passo = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); pinta(v * e); if (p < 1 && svg.isConnected) requestAnimationFrame(passo); else pinta(v); };
    pinta(0); requestAnimationFrame(passo);
  });
}
// roda de novo os velocímetros da tela (depois da abertura ou de fechar o aviso, para o barbeiro ver o ponteiro subir)
function reanimarGauges(){ document.querySelectorAll("svg.gsvg[data-ok]").forEach(x => x.removeAttribute("data-ok")); animarGauges(); }
function pill(nivel, txt){ return `<span class="pill ${nivel || "n"}">${txt}</span>`; }
// linha de progresso da meta de faturamento, com quanto falta em destaque (barbeiro e barbearia)
function cardLinha(titulo, sub, real, meta, esperado, restantes, proj, oque = "faturados"){
  const falta = Math.max(0, meta - real), deveria = meta * (esperado || 0);
  return `<section class="card"><div class="card-head"><div><h2>${titulo}</h2><span class="sm muted">${sub}</span></div></div>
    <div style="margin-top:12px">${barra(real / meta, null, esperado ? Math.max(.05, esperado) : null)}<div class="sm" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px"><span><b>${money0(real)}</b> ${oque} · ${pctTxt(real / meta)}</span><span class="muted">${falta ? `falta ${money0(falta)}${restantes ? ` · ${money0(falta / restantes)} por dia` : ""}` : `passou ${money0(real - meta)}`}</span></div>
      <div style="text-align:center;margin-top:14px"><span class="lbl">${falta ? "Falta para bater a meta" : "Meta batida! Passou"}</span><div class="num ${falta ? "acc" : "good"}" style="font-size:32px">${money0(falta || real - meta)}</div></div>
      <div class="cmp" style="margin-top:10px;justify-content:center">${esperado ? pill(real >= deveria ? "good" : real >= deveria * .9 ? "warn" : "bad", `Esperado até agora ${money0(deveria)}`) : ""}${esperado ? pill(proj >= meta ? "good" : "warn", `Projeção ${money0(proj)}`) : ""}</div></div></section>`;
}
function barra(r, marca, ritmo){
  const q = ritmo ? r / ritmo : r, nv = r == null ? "n" : q >= .89 ? "good" : q >= .67 ? "warn" : "bad";
  const x = Math.max(0, Math.min(1, r || 0)) * 5;
  return `<div class="sbar5 ${nv}">${Array.from({ length:5 }, (_, k) => `<i><b style="width:${Math.round(Math.max(0, Math.min(1, x - k)) * 100)}%"></b></i>`).join("")}</div>`;
}

function delta(v, ref, fmt){ if (ref == null || !isFinite(ref) || ref === 0) return ""; const d = v / ref - 1; return `<span class="${d >= 0 ? "good" : "bad"}">${d >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(d*100))}% vs média</span>`; }

function periodoBar(){
  const p = periodo(S.per.tipo, S.per.ref), futuro = moverPeriodo(p, 1) > today();
  return `<div class="pbar">
    <div class="seg" role="group" aria-label="Período">${TIPOS.map(([k,n]) => `<button data-act="tipo" data-v="${k}" aria-pressed="${S.per.tipo === k}">${n}</button>`).join("")}</div>
    <div class="pnav"><button class="icon-btn" data-act="per" data-v="-1" aria-label="Período anterior">‹</button><b>${esc(p.label)}</b><button class="icon-btn" data-act="per" data-v="1" aria-label="Próximo período" ${futuro ? "disabled" : ""}>›</button>${p.ini <= today() && p.fim >= today() ? "" : `<button class="btn ghost sm" data-act="perHoje">Atual</button>`}</div>
  </div>`;
}

// meta de comissão do mês: comissão lançada pelo admin (ou a estimada pela %, enquanto não houver)
function cardComissao(lancMes, perfil){
  const meta = +perfil.ganho_desejado || 0; if (!meta) return "";
  const h = today(), mI = mesIni(h), mF = mesFim(h), t = totais(lancMes), temHoje = lancMes.some(l => l.data === h);
  const restantes = uteisEntre(temHoje ? addD(h, 1) : h, mF), feitos = uteisEntre(mI, temHoje ? h : addD(h, -1));
  const real = t.comissao_rs > 0, com = real ? t.comissao_rs : ganhoEstimado(t, perfil), proj = feitos ? com / feitos * (feitos + restantes) : 0;
  return cardLinha(`Meta de comissão de ${pD(h).toLocaleDateString("pt-BR",{month:"long"})}`, `${money0(meta)} · ${real ? "pela comissão lançada até hoje" : "estimada pela % de comissão"}`,
    com, meta, feitos ? feitos / ((feitos + restantes) || 1) : 0, restantes, proj, real ? "de comissão" : "de comissão estimada");
}
function cardRitmo(lancMes, metasB, perfil){
  const h = today(), mI = mesIni(h), mF = mesFim(h);
  const m = metasB.find(x => String(x.mes).slice(0,10) === mI);
  const t = totais(lancMes), temHoje = lancMes.some(l => l.data === h);
  const restantes = uteisEntre(temHoje ? addD(h, 1) : h, mF), feitos = uteisEntre(mI, temHoje ? h : addD(h, -1));
  const proj = feitos ? t.faturamento / feitos * (feitos + restantes) : 0;
  if (!m || !(+m.faturamento > 0)) return `<section class="card"><h2>Meta de ${pD(h).toLocaleDateString("pt-BR",{month:"long"})}</h2><p class="empty">${S.me.papel === "admin" ? "Defina a meta deste mês em Meta do barbeiro." : "O admin ainda não definiu a sua meta deste mês."}</p></section>`;
  const esperado = feitos / ((feitos + restantes) || 1);
  return cardLinha(`Meta de faturamento de ${pD(h).toLocaleDateString("pt-BR",{month:"long"})}`, `${money0(+m.faturamento)} · ${feitos + restantes} dias de trabalho no mês${feitos ? ` · ${feitos} já passaram` : ""}`,
    t.faturamento, +m.faturamento, feitos ? esperado : 0, restantes, proj);
}

// executa depois que o HTML entra na página (gráficos)
const _pos = [];
function posRender(fn){ _pos.push(fn); return ""; }
function corVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function graficoEvo(lista, metasB, p){
  const el = document.getElementById("chEvo"); if (!el || !window.Chart) return;
  const dias = (pD(p.fim) - pD(p.ini)) / 864e5 + 1;
  const modo = dias <= 31 ? "dia" : dias <= 186 ? "semana" : "mes";
  const baldes = [];
  if (modo === "dia") for (let d = p.ini; d <= p.fim; d = addD(d, 1)) baldes.push({ ini:d, fim:d, rot:dataBR(d) });
  else if (modo === "semana") { for (let d = p.ini; d <= p.fim; d = addD(d, 7)) { const f = addD(d, 6) > p.fim ? p.fim : addD(d, 6); baldes.push({ ini:d, fim:f, rot:dataBR(d) }); } }
  else for (let d = p.ini; d <= p.fim; d = addM(d, 1)) baldes.push({ ini:d, fim:mesFim(d), rot:pD(d).toLocaleDateString("pt-BR",{month:"short"}).replace(".","") });
  const fat = baldes.map(b => totais(lista.filter(l => l.data >= b.ini && l.data <= b.fim)).faturamento);
  const meta = baldes.map(b => Math.round(metaNoIntervalo(metasB, b.ini, b.fim).faturamento) || null);
  charts.push(new Chart(el, {
    data:{ labels:baldes.map(b => b.rot), datasets:[
      { type:"bar", label:"Faturamento", data:fat, backgroundColor:corVar("--accent"), borderRadius:4, maxBarThickness:28, order:2 },
      { type:"line", label:"Meta", data:meta, borderColor:corVar("--muted"), borderDash:[5,4], pointRadius:0, borderWidth:2, stepped:modo === "dia" ? false : "middle", spanGaps:true, order:1 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${money0(c.raw)}` } } },
      scales:{ x:{ grid:{ display:false }, ticks:{ color:corVar("--muted"), maxRotation:0, autoSkip:true, maxTicksLimit:10 } },
               y:{ beginAtZero:true, grid:{ color:corVar("--line") }, ticks:{ color:corVar("--muted"), callback:v => v >= 1000 ? (v/1000).toLocaleString("pt-BR") + " mil" : v } } } }
  }));
}

async function pgDashboard(){

// três pódios do mês em R$: quem mais faturou, quem mais vendeu extras e quem mais vendeu produtos
// dois rankings do mês: meta individual (% da meta do mês de cada um) e faturamento geral (R$)
function rankings(linhas, p, doQue = "do mês"){
  const pos = i => `<i class="m${Math.min(i + 1, 4)}">${i + 1}º</i>`;
  const comMeta = linhas.filter(l => l.av.metaCheia.faturamento > 0).map(l => ({ ...l, r:l.av.t.faturamento / l.av.metaCheia.faturamento })).sort((a, b) => b.r - a.r);
  const bat = comMeta.filter(l => l.r >= 1).length;
  const rk1 = comMeta.map((l, i) => `<li data-act="abrir" data-v="${l.b.id}">${pos(i)}${avatar(l.b, "av-sm")}<b>${esc(primeiroNome(l.b.nome))}</b><span class="${l.r >= 1 ? "good" : ""}">${l.r >= 1 ? "✓ " : ""}${pctTxt(l.r)}</span><div class="rk-sub">${barra(Math.min(1, l.r), null, null)}<span class="xs muted">${money0(l.av.t.faturamento)} de ${money0(l.av.metaCheia.faturamento)}${l.r >= 1 ? " · meta batida" : ` · faltam ${money0(l.av.metaCheia.faturamento - l.av.t.faturamento)}`}</span></div></li>`).join("");
  const porFat = linhas.filter(l => l.av.t.faturamento > 0).sort((a, b) => b.av.t.faturamento - a.av.t.faturamento), maxF = porFat.length ? porFat[0].av.t.faturamento : 1;
  const rk2 = porFat.map((l, i) => `<li data-act="abrir" data-v="${l.b.id}">${pos(i)}${avatar(l.b, "av-sm")}<b>${esc(primeiroNome(l.b.nome))}</b><span>${money0(l.av.t.faturamento)}</span><div class="rk-sub">${barra(l.av.t.faturamento / maxF, null, null).replace(/sbar5 \w+/, "sbar5 acc")}<span class="xs muted">${i ? `${money0(maxF - l.av.t.faturamento)} atrás do 1º` : `maior faturamento ${doQue}`}</span></div></li>`).join("");
  return `<section class="card"><h2>Rankings ${doQue}</h2><span class="sm muted">${esc(p.label)} · toque no nome para abrir o painel</span>
    <div class="pods rk">
      <div class="pod"><div class="pod-h"><span class="lbl">Meta individual</span>${comMeta.length ? pill(bat ? "good" : "n", `${bat} de ${comMeta.length} bateram`) : ""}</div>${rk1 ? `<ol>${rk1}</ol>` : `<p class="xs muted" style="margin:8px 0 0">Defina as metas em Meta do barbeiro.</p>`}<span class="xs muted rk-nota">% da meta de faturamento ${doQue === "do mês" ? "do mês inteiro" : doQue} de cada um</span></div>
      <div class="pod"><div class="pod-h"><span class="lbl">Faturamento geral</span></div>${rk2 ? `<ol>${rk2}</ol>` : `<p class="xs muted" style="margin:8px 0 0">Sem faturamento ainda.</p>`}<span class="xs muted rk-nota">serviços + extras + produtos + assinaturas, em R$</span></div>
    </div></section>`;
}
function podios(linhas, p){
  const cols = [["extras","Serviços extras"],["produtos","Produtos"]].map(([k, n]) => {
    const top = linhas.filter(l => l.av.t[k] > 0).sort((a, b) => b.av.t[k] - a.av.t[k]).slice(0, 3);
    return `<div class="pod"><span class="lbl">${n}</span>${top.length ? `<ol>${top.map((l, i) => `<li data-act="abrir" data-v="${l.b.id}"><i class="m${i + 1}">${i + 1}º</i>${avatar(l.b, "av-sm")}<b>${esc(primeiroNome(l.b.nome))}</b><span>${money0(l.av.t[k])}</span></li>`).join("")}</ol>` : `<p class="xs muted" style="margin:8px 0 0">Sem vendas ainda.</p>`}</div>`; }).join("");
  return `<section class="card"><h2>Pódios do mês</h2><span class="sm muted">${esc(p.label)} · em R$, quem mais vendeu extras e produtos</span><div class="pods duo">${cols}</div></section>`;

function graficoAcumulado(lista, linhas, p, mLoja, assin){
  const el = document.getElementById("chAcum"); if (!el || !window.Chart) return;
  const h = today(), labels = [], real = [], meta = [];
  let ac = 0, am = 0;
  for (let d = p.ini; d <= p.fim; d = addD(d, 1)) {
    labels.push(dataBR(d));
    am += mLoja ? (ehDiaUtil(d) ? mLoja / uteisNoMes(p.ini) : 0) : linhas.reduce((s, l) => s + metaNoIntervalo(metasDe(l.b.id), d, d).faturamento, 0);
    meta.push(Math.round(am));
    if (d <= h) { ac += lista.filter(l => l.data === d).reduce((s, l) => s + (+l.servicos||0) + (+l.extras||0) + (+l.produtos||0) + (+l.assinatura_rs||0), 0) + (assin || []).filter(x => String(x.data).slice(0, 10) === d).reduce((s, x) => s + (+x.valor || 0), 0); real.push(Math.round(ac)); } else real.push(null);
  }
  charts.push(new Chart(el, {
    type:"line",
    data:{ labels, datasets:[
      { label:"Equipe", data:real, borderColor:corVar("--accent"), backgroundColor:corVar("--accent-soft"), fill:true, pointRadius:0, borderWidth:3, tension:.2, order:1 },
      { label:"Meta", data:meta, borderColor:corVar("--muted"), borderDash:[5,4], pointRadius:0, borderWidth:2, order:2 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:false, interaction:{ mode:"index", intersect:false },
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${money0(c.raw)}` } } },
      scales:{ x:{ grid:{ display:false }, ticks:{ color:corVar("--muted"), maxRotation:0, autoSkip:true, maxTicksLimit:8 } },
               y:{ beginAtZero:true, grid:{ color:corVar("--line") }, ticks:{ color:corVar("--muted"), callback:v => v >= 1000 ? (v/1000).toLocaleString("pt-BR") + " mil" : v } } } }
  }));
}

// planilha em CSV com ; e vírgula decimal, que o Excel em português abre direto
function baixarCSV(nome, linhas){
  const cel = v => typeof v === "number" ? String(Math.round(v * 10000) / 10000).replace(".", ",") : `"${String(v ?? "").replace(/"/g, '""')}"`;
  const txt = "﻿" + linhas.map(l => l.map(cel).join(";")).join("\r\n");

}

/* ======================= IMPORTAR DO CASHBARBER ======================= */
// Relatório de comandas do CashBarber (CSV): uma linha por comanda ou cobrança de assinatura.
// Por barbeiro e dia: atendimentos = comandas (assinante conta, mesmo com R$ 0), serviços R$ = soma das comandas,
// assinaturas novas = cobrança feita no horário de atendimento para um cliente que teve comanda com ele no mesmo dia
// (as renovações automáticas saem de madrugada e não contam).
function lerCSV(txt){
  txt = txt.replace(/^﻿/, "");
  const sep = (txt.split("\n")[0].match(/;/g) || []).length > (txt.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const linhas = []; let campo = "", linha = [], aspas = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (aspas) { if (c === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && txt[i + 1] === "\n") i++; linha.push(campo); campo = ""; if (linha.some(x => x.trim())) linhas.push(linha); linha = []; }
    else campo += c;
  }
  linha.push(campo); if (linha.some(x => x.trim())) linhas.push(linha);
  return linhas;
}
const semAcento = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
function lerCashBarber(txt){
  const [cab, ...corpo] = lerCSV(txt), col = n => cab.findIndex(h => semAcento(h).includes(n));
  const iP = col("profissional"), iC = col("cliente"), iT = col("tipo"), iV = col("valor"), iD = col("data");
  if ([iP, iT, iV, iD].some(i => i < 0)) throw new Error("Não reconheci o arquivo. Use o relatório de comandas do CashBarber em CSV (colunas Profissional, Tipo, Valor e Data e hora).");
  const dia = s => { const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}))?/); return m ? { data:`${m[3]}-${m[2]}-${m[1]}`, hora:+(m[4] || 12) } : null; };
  const comandas = [], assin = [];
  for (const r of corpo) {
    const d = dia(r[iD]); if (!d) continue;
    const tipo = semAcento(r[iT]), item = { prof:(r[iP] || "").trim(), cliente:semAcento(r[iC]), valor:parseNum(r[iV]), ...d };
    if (tipo.startsWith("comanda") && item.prof && item.prof !== "N/A") comandas.push(item);
    else if (tipo.startsWith("assinatura")) assin.push(item);
  }
  const g = new Map(), chave = (p, d) => p + "|" + d;
  for (const c of comandas) { const k = chave(c.prof, c.data); const x = g.get(k) || { prof:c.prof, data:c.data, atendimentos:0, servicos:0, assinaturas:0, zero:0 }; x.atendimentos++; x.servicos += c.valor; if (!c.valor) x.zero++; g.set(k, x); }
  let renov = 0, novasSem = 0;
  for (const a of assin) {
    if (a.hora < 6) { renov++; continue; }
    const c = comandas.find(c => c.data === a.data && c.cliente && c.cliente === a.cliente);
    if (c) g.get(chave(c.prof, c.data)).assinaturas++; else novasSem++;
  }
  const ad = new Map(); for (const a of assin) { const x = ad.get(a.data) || { data:a.data, valor:0, cobrancas:0 }; x.valor += a.valor; x.cobrancas++; ad.set(a.data, x); }
  const assinDias = [...ad.values()].map(x => ({ ...x, valor:Math.round(x.valor * 100) / 100 }));
  const dias = [...new Set(comandas.map(c => c.data).concat(assinDias.map(x => x.data)))].sort();
  return { assinDias, linhas:[...g.values()], profs:[...new Set(comandas.map(c => c.prof))].sort(), ini:dias[0], fim:dias.at(-1), renov, novasSem, total:comandas.length };
}

const CAMPOS_FAT = CAMPOS_AC.filter(([k]) => k !== "comissao_rs");
const r2 = v => Math.round(v * 100) / 100;

// ls = lançamentos do barbeiro no mês; novo = total do mês até o dia d. Devolve os dias a gravar (d e, se houver, a próxima atualização)
function acumular(ls, d, novo){
  const antes = ls.filter(l => l.data < d), ult = antes.map(l => l.data).sort().at(-1);

async function pgCalc(){
  const me = S.equipe.find(e => e.id === S.me.id) || S.me;
  const h = today(), hist = await DB.lancamentos(addD(h, -90), h, me.id), t = totais(hist);
  const mixProd = t.faturamento ? t.produtos / t.faturamento : .08;
  const cs = (+me.comissao_servicos||0) / 100, cp = (+me.comissao_produtos||0) / 100;
  const taxa = (1 - mixProd) * cs + mixProd * cp;
  const ticket = +me.ticket_medio || t.ticket || 0;
  const ganho = +me.ganho_desejado || 0;
  const u = uteisNoMes(h), mi = mesIni(h);
  const m = metasDe(me.id).find(x => String(x.mes).slice(0,10) === mi);
  // ritmo do mês: igual ao painel (conta até hoje se hoje já foi lançado, senão até ontem)
  const doMes = hist.filter(l => l.data >= mi), fatMes = totais(doMes).faturamento;
  const ganhoMes = doMes.reduce((s, l) => s + ((+l.servicos||0) + (+l.extras||0)) * cs + (+l.produtos||0) * cp, 0);
  const feitos = uteisEntre(mi, doMes.some(l => l.data === h) ? h : addD(h, -1));
  const proj = feitos ? fatMes / feitos * u : 0;
  // comissão real lançada pelo admin; sem ela, vale a estimativa pela %
  const comReal = totais(doMes).comissao_rs, temReal = comReal > 0, ganhoAtual = temReal ? comReal : ganhoMes;
  const metaFat = m ? +m.faturamento || 0 : 0;
  $("#psub").textContent = "Sua meta de comissão e onde você pode chegar no mês";
  const linha = (rot, fat, sub) => `<div class="li"><span style="flex:1;min-width:0"><b>${rot}</b><br><span class="xs muted">${sub}</span></span><span style="text-align:right;white-space:nowrap"><b class="acc">${money0(fat * taxa)}</b><br><span class="xs muted">faturando ${money0(fat)}</span></span></div>`;
  // as metas que o admin definiu para este barbeiro no mês
  const tm = totais(doMes), restam = Math.max(0, u - feitos);
  const metaIt = (rot, real, meta, semMeta) => `<div class="mi"><span class="lbl">${rot}</span><div class="num" style="font-size:22px">${meta ? money0(meta) : "—"}</div>
    ${meta ? `${barra(real / meta, null, Math.max(.05, feitos / u))}<span class="xs ${real >= meta ? "good" : "muted"}">${money0(real)} até agora · ${real >= meta ? "meta batida!" : `faltam ${money0(meta - real)}${restam ? ` (${money0((meta - real) / restam)}/dia)` : ""}`}</span>` : `<span class="xs muted">${semMeta}</span>`}</div>`;
  const cardMetas = `<section class="card"><h2>Suas metas de ${esc(pD(h).toLocaleDateString("pt-BR", { month:"long" }))}</h2><span class="sm muted">Definidas pelo admin só para você · ${u} dias de trabalho no mês, ${restam} pela frente</span>
    <div class="metas-ind">
      ${metaIt("Faturamento", tm.faturamento, metaFat, "O admin ainda não definiu.")}
      ${metaIt("Comissão", ganhoAtual, ganho, "O admin ainda não definiu.")}
      ${metaIt("Serviços extras", tm.extras, m ? +m.extras || 0 : 0, "Sem meta: você é comparado com a média da equipe.")}
      ${metaIt("Produtos", tm.produtos, m ? +m.produtos || 0 : 0, "Sem meta: você é comparado com a média da equipe.")}
    </div><p class="xs muted" style="margin:10px 0 0">Sua nota: 60% faturamento, 20% extras e 20% produtos.</p></section>`;
  return `${cardMetas}<section class="card"><div class="card-head"><div><span class="lbl">Sua meta de comissão no mês</span><div class="num acc" style="font-size:34px;margin:4px 0">${ganho ? money0(ganho) : "—"}</div><span class="sm muted">Definida pelo admin. Comissão: ${numIn(me.comissao_servicos) || 0}% em serviços e extras e ${numIn(me.comissao_produtos) || 0}% em produtos.</span></div></div>
    ${ganho ? `${barra(ganhoAtual / ganho, null, Math.max(.05, feitos / u))}<div class="sm" style="display:flex;justify-content:space-between;margin-top:6px"><span>${money0(ganhoAtual)} ${temReal ? "de comissão até hoje" : "de comissão estimada até agora"} · ${pctTxt(ganhoAtual / ganho)}</span><span class="muted">falta ${money0(Math.max(0, ganho - ganhoAtual))}</span></div>` : ""}
    ${temReal ? `<div class="calc-out">
      <div><span class="lbl">Comissão até hoje</span><div class="num acc">${money0(comReal)}</div><span class="xs muted">lançada pelo admin</span></div>
      <div><span class="lbl">Meta de comissão</span><div class="num">${ganho ? money0(ganho) : "—"}</div>${ganho ? `<span class="xs muted">${comReal >= ganho ? `passou ${money0(comReal - ganho)}` : `falta ${money0(ganho - comReal)}`}</span>` : ""}</div>
      <div><span class="lbl">No ritmo atual</span><div class="num ${ganho && feitos && comReal / feitos * u >= ganho ? "good" : ""}">${feitos ? money0(comReal / feitos * u) : "—"}</div><span class="xs muted">de comissão no mês</span></div>
      <div><span class="lbl">Estimada pela %</span><div class="num">${money0(ganhoMes)}</div><span class="xs muted">${Math.abs(comReal - ganhoMes) < 1 ? "igual à real" : `${comReal > ganhoMes ? "real " + money0(comReal - ganhoMes) + " acima" : "real " + money0(ganhoMes - comReal) + " abaixo"}`}</span></div>
    </div>` : ""}
    <div id="calcOut">${ganho ? calcOut(ganho, taxa, ticket, u, m) : `<p class="empty">O admin ainda não definiu a sua meta de comissão.</p>`}</div>
  </section>
  <section class="card"><h2>Onde você pode chegar</h2><span class="sm muted">Quanto você tira de comissão no mês em cada cenário (estimativa pela sua %).</span><div class="list" style="margin-top:8px">

function calcOut(ganho, taxa, ticket, u, m){

}

// reduz a foto para 320×320 (recorte central) antes de enviar
async function fotoQuadrada(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => err(new Error("Não consegui abrir essa imagem.")); i.src = url; });
    const t = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas"); c.width = c.height = 320;
    c.getContext("2d").drawImage(img, (img.naturalWidth - t) / 2, (img.naturalHeight - t) / 2, t, t, 0, 0, 320, 320);
    return await new Promise(ok => c.toBlob(ok, "image/jpeg", .86));
  } finally { URL.revokeObjectURL(url); }
}

/* ======================= FUNDO 3D DO LOGIN ======================= */
// As linhas laranja ondulam devagar e ganham profundidade (as linhas "flutuam" sobre o preto).
// Inclinar o celular (ou mexer o mouse) muda a perspectiva. Para quando a tela de login some,
// a aba fica em segundo plano ou a pessoa pediu menos movimento no sistema.
let _fundo3d = null;
function fundo3D(){
  if (_fundo3d) { _fundo3d.parar(); _fundo3d = null; }
  const box = document.querySelector("#authRoot .auth");
  if (!box || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "auth-3d";
  const gl = cv.getContext("webgl", { alpha:false, antialias:false, powerPreference:"low-power", preserveDrawingBuffer:false });
  if (!gl) return;
  const sh = (tipo, src) => { const o = gl.createShader(tipo); gl.shaderSource(o, src); gl.compileShader(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `precision mediump float;varying vec2 v;uniform sampler2D img;uniform vec2 esc,tilt;uniform float t;
    float lum(vec2 u){vec3 c=texture2D(img,u).rgb;return dot(c,vec3(.5,.4,.1));}
    void main(){
      vec2 u=vec2(v.x,1.-v.y);u=(u-.5)*esc+.5;
      vec2 o=vec2(sin(u.y*9.+t*.7)+.6*sin(u.x*5.-t*.45),cos(u.x*7.-t*.6)+.6*cos(u.y*4.+t*.4))*.0035;
      float d=lum(u+o);
      vec2 q=u+o+tilt*(.018+.007*d);
      vec3 c=texture2D(img,clamp(q,.001,.999)).rgb;
      c*=1.+.35*d*(.5+.5*sin(t*.9+u.x*6.+u.y*3.));
      float y=v.y;float a=y>.55?mix(.55,.35,(y-.55)/.45):mix(.88,.55,y/.55);
      gl_FragColor=vec4(c*(1.-a),1.);}`));
  gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const ap = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n), uEsc = U("esc"), uTilt = U("tilt"), uT = U("t");
  let iw = 1, ih = 1, raf = 0, vivo = true, ultimo = 0, alvo = { x:0, y:0 }, at = { x:0, y:0 }, base = null, sensor = false;
  const t0 = performance.now();
  const medir = () => {
    const dpr = Math.min(devicePixelRatio || 1, 1.5), w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (!w || !h) return;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
    const ri = iw / ih, rc = w / h; gl.uniform2f(uEsc, rc > ri ? 1 : rc / ri, rc > ri ? ri / rc : 1);  // "cover"
  };
  const quadro = agora => {
    if (!vivo) return;
    raf = requestAnimationFrame(quadro);
    if (!cv.isConnected || cv.closest("[hidden]")) return parar();
    if (document.hidden || agora - ultimo < 33) return;  // ~30 fps poupa bateria
    ultimo = agora;
    const t = (agora - t0) / 1000;
    const a = sensor ? alvo : { x:alvo.x + Math.sin(t * .23) * .25, y:alvo.y + Math.cos(t * .17) * .2 };
    at.x += (a.x - at.x) * .08; at.y += (a.y - at.y) * .08;
    cv.style.transform = `perspective(900px) rotateX(${(-at.y * 5).toFixed(2)}deg) rotateY(${(at.x * 6).toFixed(2)}deg)`;
    gl.uniform2f(uTilt, at.x, -at.y); gl.uniform1f(uT, t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
  const lim = v => Math.max(-1, Math.min(1, v));
  const giro = e => {
    if (e.beta == null) return;
    if (!base) base = { b:e.beta, g:e.gamma };
    sensor = true; alvo = { x:lim((e.gamma - base.g) / 25), y:lim((e.beta - base.b) / 25) };
  };
  const mouse = e => { if (e.pointerType !== "mouse") return; alvo = { x:lim(e.clientX / innerWidth * 2 - 1), y:lim(e.clientY / innerHeight * 2 - 1) }; };
  const pedirSensor = () => { const D = window.DeviceOrientationEvent; if (D && typeof D.requestPermission === "function") D.requestPermission().catch(() => {}); };
  function parar(){ vivo = false; cancelAnimationFrame(raf); removeEventListener("deviceorientation", giro); removeEventListener("pointermove", mouse); removeEventListener("resize", medir); box.removeEventListener("pointerdown", pedirSensor); }
  const img = new Image();
  img.onload = () => {
    if (!vivo) return;
    try {
      const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } catch (e) { cv.remove(); return parar(); }
    iw = img.naturalWidth; ih = img.naturalHeight; medir();
    raf = requestAnimationFrame(quadro); setTimeout(() => cv.classList.add("on"), 60);
  };
  img.src = innerWidth > innerHeight ? "icons/fundo-linhas-largo.jpg" : "icons/fundo-linhas.jpg";
  box.prepend(cv);
  addEventListener("deviceorientation", giro); addEventListener("pointermove", mouse); addEventListener("resize", medir);
  box.addEventListener("pointerdown", pedirSensor, { once:true });
  _fundo3d = { parar };
}

  const titulos = { entrar:"Entrar", criar:"Criar conta", esqueci:"Recuperar senha" };
  R.innerHTML = `<div class="auth"><form class="auth-box" id="authForm" novalidate><div class="auth-marca">${SIMBOLO()}<img src="icons/bold-wordmark.png" alt="Bold" width="260" height="88"><span>Performance</span></div>
    ${msg ? `<div class="auth-msg">${msg}</div>` : ""}
    ${modo === "criar" ? `<p class="sm muted" style="margin:0">Crie a sua conta. O admin recebe o seu cadastro e libera o acesso.</p><label class="f">Seu nome<input id="au-nome" autocomplete="name" required></label>` : ""}
    <label class="f">E-mail<input type="email" id="au-email" autocomplete="email" required></label>
    ${modo === "criar" ? `<label class="aceite"><input type="checkbox" id="au-aceite"><span>Li e aceito a <button type="button" class="link" data-act="privLer">Política de privacidade</button>. Meus dados de trabalho ficam visíveis para o admin da barbearia.</span></label>` : ""}
    ${modo !== "esqueci" ? `<label class="f">Senha<input type="password" id="au-senha" autocomplete="${modo === "criar" ? "new-password" : "current-password"}" minlength="6" required></label>` : ""}
    <button class="btn" type="submit">${titulos[modo]}</button>
    <div class="auth-links">${modo === "entrar" ? `<button type="button" class="link" data-auth="criar">Criar conta</button><button type="button" class="link" data-auth="esqueci">Esqueci a senha</button>` : `<button type="button" class="link" data-auth="entrar">Voltar para entrar</button>`}</div>
  </form></div>`;
  R.querySelectorAll("[data-auth]").forEach(b => b.onclick = () => telaLogin(b.dataset.auth));
  $("#authForm").onsubmit = async ev => {
    ev.preventDefault();
    const email = $("#au-email").value.trim(), senha = $("#au-senha") && $("#au-senha").value;
    const btn = ev.target.querySelector("button[type=submit]"); btn.disabled = true;
    try {
      if (modo === "entrar") { const { error } = await sb.auth.signInWithPassword({ email, password:senha }); if (error) throw error; await iniciar(); }
      else if (modo === "criar") {
        if (!senha || senha.length < 6) throw new Error("A senha precisa de pelo menos 6 caracteres.");
        const nome = ($("#au-nome").value || "").trim(); if (!nome) throw new Error("Preencha o seu nome.");
        if (!$("#au-aceite").checked) throw new Error("Para criar a conta, aceite a política de privacidade.");
        const { data, error } = await sb.auth.signUp({ email, password:senha, options:{ emailRedirectTo:location.origin + location.pathname, data:{ app:"bold", nome, privacidade:new Date().toISOString() } } }); if (error) throw error;
        if (data.session) await iniciar(); else telaLogin("entrar", "Conta criada. Confirme pelo link que enviamos para o seu e-mail e depois entre aqui. O admin precisa aprovar o seu acesso.");
      } else { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:location.origin + location.pathname }); if (error) throw error; telaLogin("entrar", "Enviamos um link para criar uma nova senha."); }
    } catch (err) {
      const m = /Invalid login/i.test(err.message) ? "E-mail ou senha incorretos." : /confirm/i.test(err.message) ? "Confirme o seu e-mail pelo link que enviamos antes de entrar." : err.message;
      telaLogin(modo, esc(m));
    } finally { btn.disabled = false; }
  };
}

function faixaComo(){
  const b = $("#demoband");
  if (S.comoAdmin) { b.hidden = false; b.innerHTML = `Vendo como ${esc(primeiroNome(S.me.nome))} vê o app<button data-act="voltarAdmin">Voltar ao admin</button>`; }
  else if (DEMO) { b.hidden = false; b.innerHTML = `Modo demonstração · dados fictícios<button data-act="sair">Trocar conta</button>`; }
  else b.hidden = true;
}
async function iniciar(){
  let me;
  try { me = await DB.me(); } catch (e) { console.error(e); return telaLogin("entrar", "Não foi possível conectar. Verifique a internet."); }
  if (!me) return telaLogin("entrar");
  if (me.semPerfil) { await sb.auth.signOut(); return telaLogin("entrar", `A conta <b>${esc(me.email)}</b> ainda não foi liberada. Peça para o admin cadastrar este e-mail em Barbeiros.`); }
  if (me.aprovado === false) { if (!DEMO) await sb.auth.signOut(); else lsSet("bp-demo-user", null); return telaLogin("entrar", `Olá, ${esc(nome1(me.nome))}! Seu cadastro foi enviado para o admin. Assim que ele aprovar, é só entrar de novo.`); }
  if (!me.ativo) { if (!DEMO) await sb.auth.signOut(); else lsSet("bp-demo-user", null); return telaLogin("entrar", "Esta conta está desativada. Fale com o admin."); }
  S.me = me;
  // um só velocímetro: a tela de abertura fica por cima até a primeira página estar pronta
  const R = $("#authRoot"); if (!R.querySelector(".splash")) R.innerHTML = `<div class="splash">${SIMBOLO("anim")}</div>`;
  const t0 = performance.now();
  await carregarBase();
  S.tab = S.me.papel === "admin" ? "dashboard" : "painel";
  $("#app").hidden = false;
  faixaComo();
  await render();
  // a abertura fica pelo menos o tempo de o ponteiro ir e voltar uma vez
  const resta = 1300 - (performance.now() - t0); if (resta > 0) await new Promise(r => setTimeout(r, resta));
  const sp = R.querySelector(".splash"); if (sp) sp.classList.add("sai");
  reanimarGauges();
  avisoPrivacidade().then(() => avisoAtualizacao()).catch(console.error);
  avisoFaltas().catch(console.error);
  setTimeout(() => { R.hidden = true; R.innerHTML = ""; }, 380);
}
// ao voltar para o app (celular desbloqueado, troca de aba, PWA reaberto) recarrega os dados
// e, se saiu uma versão nova do app, recarrega a página sozinho
let _saiuEm = 0, _versao = null;
const versaoApp = async () => { try { const r = await fetch(location.pathname, { cache:"no-store" }); if (!r.ok) return null; const t = await r.text(); let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return h; } catch (e) { return null; } };
// barbeiro: ao abrir o app depois de o admin atualizar os números, aparece um aviso com o resumo do mês
async function avisoAtualizacao(){
  if (S.me.papel !== "barbeiro" || S.comoAdmin) return;
  const h = today(), mi = mesIni(h), ls = await DB.lancamentos(mi, h, S.me.id);
  if (!ls.length) return;
  const marca = ls.map(l => l.atualizado_em || l.data).sort().at(-1), chave = "bp-visto-" + S.me.id;
  if (lsGet(chave, "") >= marca) return;
  const t = totais(ls), m = metasDe(S.me.id).find(x => String(x.mes).slice(0,10) === mi), meta = m ? +m.faturamento || 0 : 0;
  const ult = ls.map(l => l.data).sort().at(-1), temHoje = ult === h;
  const feitos = uteisEntre(mi, temHoje ? h : addD(h, -1)), restantes = uteisEntre(temHoje ? addD(h, 1) : h, mesFim(h)), u = feitos + restantes || 1;
  const nome = nome1(S.me.nome), mes = pD(h).toLocaleDateString("pt-BR", { month:"long" });
  // mensagem principal pela comissão (meta de comissão); sem ela, pelo faturamento
  const metaCom = +S.me.ganho_desejado || 0, real = t.comissao_rs > 0, com = real ? t.comissao_rs : ganhoEstimado(t, S.me);
  const [alvo, feito] = metaCom ? [metaCom, com] : [meta, t.faturamento];
  const falta = Math.max(0, alvo - feito), esperado = alvo * feitos / u, porDia = restantes ? falta / restantes : 0;
  const principal = metaCom
    ? `${esc(nome)}, sua comissão${real ? "" : " estimada"} em ${esc(mes)} já está em <b>${money0(com)}</b>, <b>${pctTxt(com / metaCom)}</b> da sua meta de comissão.`
    : `${esc(nome)}, você já faturou <b>${money0(t.faturamento)}</b> em ${esc(mes)}${meta ? `, <b>${pctTxt(t.faturamento / meta)}</b> da sua meta` : ""}.`;
  const frase = !alvo ? "Abra o seu painel e veja a sua nota, a sua evolução e onde dá para crescer."
    : feito >= alvo ? (metaCom ? "Meta de comissão batida! 🏆 Daqui pra frente, cada atendimento é dinheiro a mais no seu bolso." : "Meta batida! 🏆 Agora é passar dela: cada atendimento a mais vira comissão no seu bolso.")
    : feito >= esperado ? "Você está no ritmo da meta. Mantenha a constância e feche o mês acima dela."
    : feito >= esperado * .85 ? "Você está perto do ritmo. Um extra ou um produto a mais por cliente já fecha essa conta."
    : "Ainda dá tempo: agenda cheia e um extra em cada atendimento fazem a virada.";
  // quanto falta, em destaque
  const faltaBox = alvo && falta > 0 ? `<div style="background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:0 0 14px"><span class="lbl">Falta para bater a sua meta${metaCom ? " de comissão" : ""}</span><div class="num acc" style="font-size:30px;line-height:1.15">${money0(falta)}</div>${restantes ? `<span class="xs muted">cerca de ${money0(porDia)} por dia de trabalho · ${restantes} dia${restantes > 1 ? "s" : ""} restante${restantes > 1 ? "s" : ""}</span>` : ""}</div>` : "";
  const av = $("#aviso");
  av.innerHTML = `<div class="aviso-box">${SIMBOLO()}<h2 id="avisoTit">Seus números foram atualizados</h2><p class="xs muted" style="margin:0 0 14px">Resultados até ${esc(dataBR(ult))}</p>
    <p>${principal}</p>
    ${faltaBox}
    <p class="sm">${frase}</p>
    ${metaCom && meta ? `<p class="sm muted">Meta de faturamento: <b>${money0(t.faturamento)}</b> de ${money0(meta)} (${pctTxt(t.faturamento / meta)})</p>` : ""}
    <button class="btn" data-act="avisoOk">Ver minhas métricas</button></div>`;
  av.dataset.marca = marca; av.hidden = false;
}
async function aoVoltar(){
  if (S.me && !$("#app").hidden) reanimarGauges();  // toda volta ao app o ponteiro sobe de novo
  if (Date.now() - _saiuEm < 20000) return;  // voltou rápido: nada mudou
  const v = await versaoApp(); if (v != null && _versao != null && v !== _versao) return location.reload();
  if (!S.me || $("#app").hidden || $("#app").classList.contains("menu-open")) return;
  // telas com formulário não são redesenhadas para não apagar o que está sendo digitado
  const form = ["lancar","metas","barbeiros","ajustes","faltas"].includes(S.tab) || document.activeElement?.matches?.("input,textarea,select");
  try { await carregarBase(); if (!form) await render(); await avisoAtualizacao(); await avisoFaltas(); } catch (e) { console.error(e); }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) _saiuEm = Date.now(); else aoVoltar(); });
addEventListener("pageshow", e => { if (e.persisted) { _saiuEm = 0; aoVoltar(); } });
setInterval(() => { if (!document.hidden) { _saiuEm = 0; aoVoltar(); } }, 120000);  // aberto na tela: atualiza a cada 2 min
versaoApp().then(v => _versao = v);
if (sb) sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") setTimeout(() => ACOES.novaSenha(), 300); });
iniciar();
</script>
